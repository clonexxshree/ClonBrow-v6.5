<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clonbrow saver - The Isometric Realm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Three.js Engine & Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0f9ff; margin: 0; overflow: hidden; color: #0f172a;}
        
        #webgl-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .pointer-auto { pointer-events: auto; }

        .game-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 4px solid #1e293b; border-radius: 28px; box-shadow: 0 8px 0px #1e293b; }
        
        .btn-back { background: white; color: #1e293b; border: 4px solid #1e293b; border-radius: 16px; padding: 12px 24px; font-weight: 900; transition: all 0.1s; text-transform: uppercase; cursor: pointer; box-shadow: 0 6px 0 #1e293b; }
        .btn-back:active { transform: translateY(6px); box-shadow: 0 0px 0 #1e293b; }

        /* Floating HTML Labels */
        .house-label {
            position: absolute; transform: translate(-50%, -50%);
            background: white; padding: 8px 16px; border-radius: 20px;
            font-weight: 900; font-size: 16px; color: #1e293b;
            box-shadow: 0 6px 0 #1e293b; border: 4px solid #1e293b;
            pointer-events: none; transition: opacity 0.2s; white-space: nowrap; user-select: none;
        }
        .badge {
            position: absolute; top: -12px; right: -12px;
            background: #f59e0b; color: white; border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; border: 3px solid #1e293b;
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <div id="ui-layer" class="p-6 md:p-8 flex flex-col">
        <header class="w-full flex justify-between items-start pointer-auto max-w-7xl mx-auto">
            <div class="game-panel p-4 pr-8 flex items-center gap-5">
                <div class="w-16 h-16 bg-sky-400 rounded-2xl flex items-center justify-center border-4 border-slate-900 shadow-[0_4px_0_#1e293b]">
                    <i data-lucide="map" class="w-8 h-8 text-white drop-shadow-md"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-slate-800 tracking-tight">The Realm</h1>
                    <p class="text-sm font-bold text-slate-500 uppercase mt-1">Drag houses or Click to enter!</p>
                </div>
            </div>
            <div class="flex gap-4">
                <button id="backBtn" class="btn-back flex items-center gap-2">
                    <i data-lucide="arrow-left" class="w-5 h-5 font-black"></i> Hub
                </button>
            </div>
        </header>

        <div id="labels-container" class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none"></div>
    </div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('userId') || 1;
        
        // FIXED PORT: Connects properly to ../Backend/server.py to stop fallback data
        const API_BASE = 'https://shreeClonexx.pythonanywhere.com'; 
        
        document.getElementById('backBtn').onclick = () => window.location.href = `dashboard.html?userId=${userId}`;

        let dbState = { parents: [], children: [] };
        
        // --- 1. SETUP HIGH-END 3D ENGINE ---
        const container = document.getElementById('webgl-container');
        const labelsContainer = document.getElementById('labels-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0f2fe); // Clean sky blue
        scene.fog = new THREE.Fog(0xe0f2fe, 80, 250);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(70, 80, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; 
        controls.minDistance = 40; controls.maxDistance = 200;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 250;
        dirLight.shadow.camera.left = -100; dirLight.shadow.camera.right = 100;
        dirLight.shadow.camera.top = 100; dirLight.shadow.camera.bottom = -100;
        scene.add(dirLight);

        // --- 2. ENVIRONMENT GENERATION ---

        // Bright Glowing Sun
        const sunGeo = new THREE.SphereGeometry(12, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(60, 80, -80);
        scene.add(sun);

        // Better Clouds
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1 });
        for(let i=0; i<12; i++) {
            const cloud = new THREE.Group();
            const puffs = 4 + Math.floor(Math.random() * 4);
            for(let j=0; j<puffs; j++) {
                const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(4 + Math.random()*5, 1), cloudMat);
                puff.position.set(Math.random()*10, Math.random()*4, Math.random()*10);
                puff.rotation.set(Math.random(), Math.random(), Math.random());
                cloud.add(puff);
            }
            cloud.position.set((Math.random()-0.5)*200, 45 + Math.random()*25, (Math.random()-0.5)*200);
            scene.add(cloud);
        }

        // Island Base
        const islandGroup = new THREE.Group();
        const baseGeo = new THREE.CylinderGeometry(80, 75, 8, 64);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 1 }); // Purple dirt
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = -4; base.receiveShadow = true;
        islandGroup.add(base);

        const grassGeo = new THREE.CylinderGeometry(80, 80, 2, 64);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x86efac, roughness: 0.9, flatShading: true }); // Bright grass
        const grassFloor = new THREE.Mesh(grassGeo, grassMat);
        grassFloor.position.y = 1; grassFloor.receiveShadow = true;
        islandGroup.add(grassFloor);

        // --- REALISTIC GRASS (Upgraded to match explore.html) ---
        const tuftGeo = new THREE.ConeGeometry(0.2, 1.2, 3);
        tuftGeo.translate(0, 0.6, 0);
        const tuftMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, side: THREE.DoubleSide, flatShading: true });
        const tuftCount = 15000;
        const grassInstanced = new THREE.InstancedMesh(tuftGeo, tuftMat, tuftCount);
        grassInstanced.receiveShadow = true;
        
        const dummy = new THREE.Object3D();
        const gColor = new THREE.Color();
        for(let i=0; i<tuftCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 78; 
            dummy.position.set(Math.cos(angle)*radius, 2, Math.sin(angle)*radius);
            dummy.rotation.set((Math.random() - 0.5) * 0.4, Math.random() * Math.PI, (Math.random() - 0.5) * 0.4);
            const s = 0.5 + Math.random() * 0.6;
            dummy.scale.set(s, s, s);
            dummy.updateMatrix();
            grassInstanced.setMatrixAt(i, dummy.matrix);

            const shade = Math.random();
            if (shade > 0.7) gColor.setHex(0x22c55e); 
            else if (shade > 0.3) gColor.setHex(0x16a34a); 
            else gColor.setHex(0x4ade80); 
            grassInstanced.setColorAt(i, gColor);
        }
        islandGroup.add(grassInstanced);

        // --- INSTANCED ROCKS ---
        const rockGeo = new THREE.DodecahedronGeometry(1.5, 1);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9, flatShading: true });
        const rockInstanced = new THREE.InstancedMesh(rockGeo, rockMat, 60);
        rockInstanced.receiveShadow = true; rockInstanced.castShadow = true;
        const dummyRock = new THREE.Object3D();
        
        for(let i=0; i<60; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 25 + Math.random() * 50; 
            dummyRock.position.set(Math.cos(angle)*radius, 1.5, Math.sin(angle)*radius);
            const s = 0.4 + Math.random() * 1.5;
            dummyRock.scale.set(s, s*0.7, s);
            dummyRock.rotation.set(Math.random(), Math.random(), Math.random());
            dummyRock.updateMatrix();
            rockInstanced.setMatrixAt(i, dummyRock.matrix);
        }
        islandGroup.add(rockInstanced);

        // Boulders pushed to corners safely
        const hillPositions = [{x: -70, z: -70}, {x: 70, z: 70}, {x: -70, z: 70}, {x: 75, z: -20}];
        hillPositions.forEach(pos => {
            const hillGeo = new THREE.SphereGeometry(15 + Math.random()*5, 32, 16);
            const hill = new THREE.Mesh(hillGeo, grassMat);
            hill.scale.set(1, 0.5, 1);
            hill.position.set(pos.x, 1, pos.z);
            hill.receiveShadow = true;
            islandGroup.add(hill);
        });

        // Cave pushed safely out of play area
        const caveGroup = new THREE.Group();
        const caveRockMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.9, flatShading: true });
        const caveRock = new THREE.Mesh(new THREE.DodecahedronGeometry(12, 1), caveRockMat);
        caveRock.scale.set(1, 0.8, 1); caveRock.castShadow = true; caveRock.receiveShadow = true;
        caveGroup.add(caveRock);

        const hole = new THREE.Mesh(new THREE.CircleGeometry(4, 16), new THREE.MeshBasicMaterial({ color: 0x0f172a }));
        hole.position.set(0, -2, 11);
        caveGroup.add(hole);
        caveGroup.position.set(-65, 4, -40); // Far edge
        islandGroup.add(caveGroup);

        scene.add(islandGroup);

        // --- 3. MODEL LOADING (TREES COMPLETELY UNTOUCHED) ---
        const gltfLoader = new THREE.GLTFLoader();
        let loadedModels = { dutch: null, viking: null, pine: null };
        const hitboxes = []; 
        const houseGroups = []; 
        const labelElements = [];
        
        function fitToBox(object, targetSize) {
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3()).length();
            const scale = targetSize / size;
            object.scale.setScalar(scale);
            const center = box.getCenter(new THREE.Vector3());
            object.position.y += (object.position.y - center.y) * scale + (targetSize/2);
            return object;
        }

        // Load Pine Tree
        gltfLoader.load('./../graphical-content/pine_tree.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            loadedModels.pine = fitToBox(model, 12);
            scatterTrees();
        }, undefined, () => {
            console.log("No ../graphical-content/pine_tree.glb. Using fallback.");
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3, 6), new THREE.MeshStandardMaterial({color: 0x78350f, flatShading: true}));
            trunk.position.y = 1.5; trunk.castShadow = true; tree.add(trunk);
            const leafMat = new THREE.MeshStandardMaterial({color: 0x10b981, flatShading: true});
            for(let i=0; i<3; i++) {
                const leaf = new THREE.Mesh(new THREE.ConeGeometry(3 - i*0.5, 4, 6), leafMat);
                leaf.position.y = 3.5 + i*1.5; leaf.castShadow = true; tree.add(leaf);
            }
            loadedModels.pine = tree;
            scatterTrees();
        });

        function scatterTrees() {
            // Trees form a ring around the edge so they don't block the center
            for(let i=0; i<45; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 50 + Math.random() * 25; 
                const tx = Math.cos(angle) * radius;
                const tz = Math.sin(angle) * radius;

                const tree = loadedModels.pine.clone();
                tree.position.set(tx, 2, tz);
                const s = 0.6 + Math.random()*0.6;
                tree.scale.set(tree.scale.x*s, tree.scale.y*s, tree.scale.z*s);
                tree.rotation.y = Math.random() * Math.PI;
                scene.add(tree);
            }
        }

        // Temporary Fallback Houses
        const tempBoxGeo = new THREE.BoxGeometry(10, 10, 10);
        loadedModels.dutch = new THREE.Mesh(tempBoxGeo, new THREE.MeshStandardMaterial({color: 0x38bdf8}));
        loadedModels.viking = new THREE.Mesh(tempBoxGeo, new THREE.MeshStandardMaterial({color: 0xf43f5e}));

        // Load Custom Houses
        gltfLoader.load('./../graphical-content/dutch_house.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            loadedModels.dutch = fitToBox(model, 15);
            refreshModels();
        });

        gltfLoader.load('./../graphical-content/viking_house.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            loadedModels.viking = fitToBox(model, 15);
            refreshModels();
        });

        function refreshModels() {
            houseGroups.forEach(obj => {
                const isViking = obj.userData.dbData.title.includes('house-2');
                const modelSource = isViking ? loadedModels.viking : loadedModels.dutch;
                while(obj.group.children.length > 0) { obj.group.remove(obj.group.children[0]); }
                const newModel = modelSource.clone();
                newModel.position.set(0,0,0);
                obj.group.add(newModel);
            });
        }

        // --- 4. FETCH DATA & BUILD WORLD ---
        async function fetchAndRender() {
            try {
                const res = await fetch(`${API_BASE}/api/world/${userId}`);
                if (res.ok) dbState = await res.json();
            } catch (err) {
                console.warn("Backend offline. Using demo data.");
                dbState = {
                    parents: [
                        { id: 1, title: "Dutch Base|||house-1", x: 300, y: 300 },
                        { id: 2, title: "Viking Post|||house-2", x: 500, y: 150 }
                    ],
                    children: [
                        { id: 1, parentId: 1, title: "Hello!", content: "Database offline fallback." }
                    ]
                };
            }
            buildWorldIfReady();
        }

        let isWorldBuilt = false;
        let pathLine = null;

        function updatePaths() {
            if (hitboxes.length < 2) return;
            const pathMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 2, gapSize: 2, linewidth: 5 });
            const pathPoints = [new THREE.Vector3(0, 2.5, 0)]; // Start at center
            
            hitboxes.forEach(hb => {
                pathPoints.push(new THREE.Vector3(hb.position.x, 2.5, hb.position.z));
            });

            if (pathLine) scene.remove(pathLine);
            const pathGeo = new THREE.BufferGeometry().setFromPoints(pathPoints);
            pathLine = new THREE.Line(pathGeo, pathMat);
            pathLine.computeLineDistances();
            scene.add(pathLine);
        }

        function buildWorldIfReady() {
            if(isWorldBuilt) return;
            isWorldBuilt = true;

            dbState.parents.forEach((p, index) => {
                // Map DB coordinates (100-700) to World Island space (-30 to 30)
                const worldX = (p.x - 400) / 10;
                const worldZ = (p.y - 300) / 10;

                const houseGroup = new THREE.Group();
                // FIX: Ensured houses spawn strictly on the ground, not flying
                houseGroup.position.set(worldX, 2, worldZ);
                
                const isViking = p.title.includes('house-2');
                const modelSource = isViking ? loadedModels.viking : loadedModels.dutch;
                const visualModel = modelSource.clone();
                houseGroup.add(visualModel);
                scene.add(houseGroup);

                // Invisible Hitbox for Dragging/Clicking
                const hitboxGeo = new THREE.BoxGeometry(14, 18, 14);
                const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });
                const hitbox = new THREE.Mesh(hitboxGeo, hitboxMat);
                hitbox.position.set(worldX, 11, worldZ);
                
                const displayTitle = p.title.split('|||')[0];
                hitbox.userData = { isHouse: true, dbData: p, displayTitle: displayTitle, group: houseGroup };
                
                scene.add(hitbox);
                hitboxes.push(hitbox);
                houseGroups.push({ group: houseGroup, userData: hitbox.userData });

                const childCount = dbState.children ? dbState.children.filter(c => c.parentId == p.id).length : 0;
                const label = document.createElement('div');
                label.className = 'house-label';
                label.innerHTML = `${displayTitle} ${childCount > 0 ? `<div class="badge">${childCount}</div>` : ''}`;
                labelsContainer.appendChild(label);
                labelElements.push({ element: label, hitbox: hitbox });
            });

            updatePaths();
        }

        // --- 5. DRAG TO MOVE HOUSES & SAVE POSITIONS ---
        const dragControls = new THREE.DragControls(hitboxes, camera, renderer.domElement);
        let isDragging = false;

        dragControls.addEventListener('dragstart', function () { controls.enabled = false; isDragging = false; });
        
        dragControls.addEventListener('drag', function (event) {
            isDragging = true;
            event.object.position.y = 11; // lock height of hitbox
            
            // Move visual model to match hitbox
            event.object.userData.group.position.x = event.object.position.x;
            event.object.userData.group.position.z = event.object.position.z;
            event.object.userData.group.position.y = 4; // float up slightly while dragging
            
            updatePaths(); // Dynamic line snap
        });

        dragControls.addEventListener('dragend', async function (event) {
            controls.enabled = true;
            event.object.userData.group.position.y = 2; // snap to ground
            updatePaths();

            // Save new position permanently to Server
            const newX = (event.object.position.x * 10) + 400;
            const newY = (event.object.position.z * 10) + 300;
            const houseId = event.object.userData.dbData.id;

            try {
                await fetch(`${API_BASE}/api/parents/${houseId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x: newX, y: newY })
                });
            } catch(e) {
                console.warn("Could not save position to server.");
            }

            setTimeout(() => { isDragging = false; }, 50);
        });

        // --- 6. CLICK TO ENTER NPC-HOUSE ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (e) => {
            if (isDragging) return; 
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            // Intersect directly with the hitboxes for reliability
            const intersects = raycaster.intersectObjects(hitboxes);
            if (intersects.length > 0) {
                const houseId = intersects[0].object.userData.dbData.id;
                // Redirect to the NPC house view with the info
                window.location.href = `npc-house.html?userId=${userId}&houseId=${houseId}`;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Sync HTML Labels
            labelElements.forEach(labelObj => {
                const vector = labelObj.hitbox.position.clone();
                vector.y += 12; // Hover far above roof
                vector.project(camera);

                if (vector.z > 1) { labelObj.element.style.opacity = '0'; return; }
                const x = (vector.x * .5 + .5) * window.innerWidth;
                const y = (vector.y * -.5 + .5) * window.innerHeight;
                labelObj.element.style.opacity = '1';
                labelObj.element.style.left = `${x}px`;
                labelObj.element.style.top = `${y}px`;
            });

            renderer.render(scene, camera);
        }
        animate();

        fetchAndRender();
    </script>
</body>
</html>
