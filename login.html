<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClonBrow OS | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F3F4F6; /* Clean light gray background */
            color: #111827;
        }

        /* --- PURE MINIMALISM --- */
        .minimal-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px; /* Soft, normal rounded corners */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .minimal-input {
            width: 100%;
            background-color: #FFFFFF;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: #111827;
            transition: all 0.2s ease;
        }
        
        .minimal-input:focus {
            outline: none;
            border-color: #111827;
            box-shadow: 0 0 0 1px #111827;
        }

        .minimal-input::placeholder {
            color: #9CA3AF;
        }

        /* User's requested button background */
        .btn-aesthetic {
            width: 100%;
            padding: 12px 24px;
            background-image: 
                linear-gradient(135deg, rgba(17, 24, 39, 0.4), rgba(17, 24, 39, 0.7)), 
                url('https://res.cloudinary.com/f4gzfq5n/image/upload/v1788597223/photo-1705314914898-130fa5fa2e70.avif');
            background-size: cover;
            background-position: center;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 500;
            font-size: 15px;
            transition: opacity 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-aesthetic:hover:not(:disabled) {
            opacity: 0.9;
        }
        
        .btn-aesthetic:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* --- NEW: Entrance Animation --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* --- SIMPLE CSS CUBE (SCALED UP) --- */
        @keyframes slowSpin {
            0% { transform: translateZ(-100px) rotateX(-20deg) rotateY(0deg); }
            100% { transform: translateZ(-100px) rotateX(-20deg) rotateY(360deg); }
        }
        @keyframes slowSpinReverse {
            0% { transform: translateZ(-30px) rotateX(30deg) rotateY(360deg); }
            100% { transform: translateZ(-30px) rotateX(30deg) rotateY(0deg); }
        }

        .scene {
            width: 200px;
            height: 200px;
            perspective: 1000px;
            z-index: 10;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: slowSpin 20s linear infinite; /* Smooth, continuous rotation */
        }
        .cube__face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            color: #4B5563;
        }
        
        /* Clean grayscale faces */
        .cube__face--front  { background: #FFFFFF; transform: rotateY(  0deg) translateZ(100px); }
        .cube__face--right  { background: #F9FAFB; transform: rotateY( 90deg) translateZ(100px); }
        .cube__face--back   { background: #F3F4F6; transform: rotateY(180deg) translateZ(100px); }
        .cube__face--left   { background: #E5E7EB; transform: rotateY(-90deg) translateZ(100px); }
        .cube__face--top    { background: #D1D5DB; transform: rotateX( 90deg) translateZ(100px); }
        .cube__face--bottom { background: #9CA3AF; transform: rotateX(-90deg) translateZ(100px); }

        /* --- SATELLITE CUBES --- */
        .scene-small {
            width: 60px;
            height: 60px;
            perspective: 600px;
            position: absolute;
            z-index: 5;
        }
        .scene-small-1 { top: 15%; right: 15%; }
        .scene-small-2 { bottom: 15%; left: 15%; }
        .cube-small {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: slowSpinReverse 15s linear infinite;
        }
        .cube__face--small {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 1px solid #E5E7EB;
        }
        .cube__face--small-front  { background: #FFFFFF; transform: rotateY(  0deg) translateZ(30px); }
        .cube__face--small-right  { background: #F9FAFB; transform: rotateY( 90deg) translateZ(30px); }
        .cube__face--small-back   { background: #F3F4F6; transform: rotateY(180deg) translateZ(30px); }
        .cube__face--small-left   { background: #E5E7EB; transform: rotateY(-90deg) translateZ(30px); }
        .cube__face--small-top    { background: #D1D5DB; transform: rotateX( 90deg) translateZ(30px); }
        .cube__face--small-bottom { background: #9CA3AF; transform: rotateX(-90deg) translateZ(30px); }

        /* --- NEW: 3D FLOOR GRID --- */
        .scene-floor {
            position: absolute;
            width: 400px;
            height: 400px;
            background-image: 
                linear-gradient(to right, #D1D5DB 1px, transparent 1px),
                linear-gradient(to bottom, #D1D5DB 1px, transparent 1px);
            background-size: 30px 30px;
            transform: rotateX(75deg) translateZ(-80px);
            opacity: 0.5;
            /* Fades the grid out at the edges */
            mask-image: radial-gradient(circle at center, black 20%, transparent 60%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 60%);
            z-index: 1;
        }

        /* --- NEW: TYPING CURSOR --- */
        .typing-cursor::after {
            content: '█';
            animation: blink 1s step-start infinite;
            color: #9CA3AF;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- NEW: STAGGERED ENTRANCE ANIMATIONS --- */
        .stagger-1 { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; opacity: 0; }
        .stagger-2 { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; opacity: 0; }
        .stagger-3 { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; opacity: 0; }
        .stagger-4 { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; opacity: 0; }
        .stagger-5 { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; opacity: 0; }
        
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- 2-Column Split Minimal Card (INCREASED SIZE) -->
    <div class="w-full max-w-[1024px] min-h-[640px] minimal-card flex flex-col md:flex-row relative overflow-hidden animate-fade-in-up">
        
        <!-- Left Side: Simple Visual -->
        <div id="interactive-panel" class="w-full md:w-5/12 p-8 md:p-14 border-b md:border-b-0 md:border-r border-gray-100 bg-gray-50 flex flex-col items-center justify-between relative overflow-hidden">
            
            <!-- Interactive Particle Canvas -->
            <canvas id="particle-canvas" class="absolute inset-0 w-full h-full z-0 opacity-60"></canvas>

            <div class="w-full flex items-center gap-2 relative z-20">
                <span class="font-bold text-gray-900 text-xl tracking-tight">ClonBrow</span>
            </div>

            <!-- Auto-rotating Geometric Cube & Satellites -->
            <div id="scene-wrapper" class="w-full flex-1 flex flex-col items-center justify-center my-12 relative transition-transform duration-200 ease-out z-10">
                
                <!-- 3D Floor Grid -->
                <div class="scene-floor"></div>

                <!-- Satellite Cube 1 -->
                <div class="scene-small scene-small-1">
                    <div class="cube-small">
                        <div class="cube__face--small cube__face--small-front"></div>
                        <div class="cube__face--small cube__face--small-right"></div>
                        <div class="cube__face--small cube__face--small-back"></div>
                        <div class="cube__face--small cube__face--small-left"></div>
                        <div class="cube__face--small cube__face--small-top"></div>
                        <div class="cube__face--small cube__face--small-bottom"></div>
                    </div>
                </div>

                <!-- Satellite Cube 2 -->
                <div class="scene-small scene-small-2">
                    <div class="cube-small" style="animation-duration: 25s; animation-direction: reverse;">
                        <div class="cube__face--small cube__face--small-front"></div>
                        <div class="cube__face--small cube__face--small-right"></div>
                        <div class="cube__face--small cube__face--small-back"></div>
                        <div class="cube__face--small cube__face--small-left"></div>
                        <div class="cube__face--small cube__face--small-top"></div>
                        <div class="cube__face--small cube__face--small-bottom"></div>
                    </div>
                </div>

                <!-- Main Cube -->
                <div class="scene">
                    <div class="cube">
                        <div class="cube__face cube__face--front"><i class="fas fa-layer-group opacity-20 text-5xl"></i></div>
                        <div class="cube__face cube__face--right"><i class="fas fa-check-square opacity-20 text-5xl"></i></div>
                        <div class="cube__face cube__face--back"><i class="fas fa-chart-line opacity-20 text-5xl"></i></div>
                        <div class="cube__face cube__face--left"><i class="fas fa-clock opacity-20 text-5xl"></i></div>
                        <div class="cube__face cube__face--top"></div>
                        <div class="cube__face cube__face--bottom"></div>
                    </div>
                </div>
            </div>

            <!-- Terminal Status -->
            <div class="w-full text-left relative z-20 mt-auto pt-6 border-t border-gray-200">
                <p class="text-[10px] font-mono text-gray-500 uppercase tracking-widest h-4 typing-cursor" id="typing-status"></p>
            </div>

        </div>

        <!-- Right Side: Clean Form -->
        <div class="w-full md:w-7/12 p-8 md:p-16 bg-white flex flex-col justify-center relative z-10">
            
            <div class="mb-8 stagger-1">
                <h2 class="text-3xl font-bold text-gray-900 mb-2 tracking-tight">Welcome back</h2>
                <p class="text-sm text-gray-500 font-medium">Please enter your details to sign in.</p>
            </div>

            <!-- Form -->
            <div class="space-y-5">
                
                <div class="stagger-3">
                    <label class="block text-xs font-bold text-gray-700 mb-2 uppercase tracking-widest">Identifier</label>
                    <input type="text" id="boot-username" placeholder="user@clonbrow.sys" class="minimal-input" onkeypress="if(event.key === 'Enter') document.getElementById('boot-password').focus()">
                </div>
                
                <div class="stagger-4">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-widest">Access Key</label>
                        <a href="#" class="text-[10px] font-bold text-gray-400 hover:text-gray-900 transition-colors uppercase tracking-widest">Reset</a>
                    </div>
                    <input type="password" id="boot-password" placeholder="••••••••" class="minimal-input" onkeypress="if(event.key === 'Enter') handleLogin()">
                </div>

                <div class="flex items-center gap-2 pt-1 pb-2 stagger-4">
                    <input type="checkbox" id="remember" class="w-4 h-4 border-gray-300 rounded text-gray-900 focus:ring-gray-900 cursor-pointer">
                    <label for="remember" class="text-xs font-medium text-gray-600 cursor-pointer select-none">Remember me</label>
                </div>
                
                <div class="stagger-5">
                    <button onclick="handleLogin()" id="login-btn" class="btn-aesthetic">
                        Initialize Session
                    </button>
                </div>

                <div id="db-status" class="text-center text-xs font-bold text-red-600 uppercase tracking-widest hidden bg-red-50 p-3 mt-4 border border-red-200 rounded-md">
                    Connection failed. Please try again.
                </div>
                
                <div class="mt-8 text-center pt-2 stagger-5">
                    <p class="text-sm font-medium text-gray-500">
                        Don't have an account? <a href="#" class="font-bold text-gray-900 hover:underline">Sign up</a>
                    </p>
                </div>
            </div>

        </div>
    </div>
    
    <script>
        // --- DOM ELEMENTS INIT FIX ---
        const interactivePanel = document.getElementById('interactive-panel');
        const sceneWrapper = document.getElementById('scene-wrapper');
        
        // --- PARTICLE NETWORK ANIMATION ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;

        function initParticles() {
            width = canvas.width = interactivePanel.offsetWidth;
            height = canvas.height = interactivePanel.offsetHeight;
            particles = [];
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 1.5 + 0.5
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#9CA3AF';
            ctx.strokeStyle = '#E5E7EB';
            ctx.lineWidth = 0.5;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                // Bounce off edges
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // Connect particles
                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 80) {
                        ctx.beginPath();
                        ctx.globalAlpha = 1 - dist / 80;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        
        // Initialize particles on load and resize
        window.addEventListener('resize', initParticles);
        initParticles();
        animateParticles();

        // --- PARALLAX & TYPING EFFECTS ---
        
        // Mouse Parallax
        interactivePanel.addEventListener('mousemove', (e) => {
            const rect = interactivePanel.getBoundingClientRect();
            const x = (e.clientX - rect.left - rect.width / 2) / 15;
            const y = (e.clientY - rect.top - rect.height / 2) / 15;
            sceneWrapper.style.transform = `translate(${x}px, ${y}px)`;
        });

        interactivePanel.addEventListener('mouseleave', () => {
            sceneWrapper.style.transform = `translate(0px, 0px)`;
        });

        // Terminal Typing Effect
        const statuses = [
            "Initializing workspace OS v2.0...",
            "Loading registry modules...",
            "Connecting to secure node...",
            "Systems operational."
        ];
        let statusIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typingElement = document.getElementById('typing-status');

        function typeEffect() {
            const currentText = statuses[statusIndex];
            
            if (isDeleting) {
                typingElement.innerText = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typingElement.innerText = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let typingSpeed = isDeleting ? 30 : 70;

            if (!isDeleting && charIndex === currentText.length) {
                typingSpeed = 2000; // Pause at end of sentence
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                statusIndex = (statusIndex + 1) % statuses.length;
                typingSpeed = 500; // Pause before starting new sentence
            }

            setTimeout(typeEffect, typingSpeed);
        }
        
        // Start typing effect
        setTimeout(typeEffect, 500);

        // --- PYTHON ANYWHERE API LOGIN LOGIC ---
        const PYTHON_API = 'https://clonexxshree.pythonanywhere.com/api';

        async function handleLogin() {
            const usernameInput = document.getElementById('boot-username');
            const username = usernameInput.value.trim();
            const statusDiv = document.getElementById('db-status');
            const btn = document.getElementById('login-btn');
            
            if (!username) {
                usernameInput.focus();
                return;
            }

            // UI Feedback
            btn.innerHTML = 'Connecting... <i class="fas fa-circle-notch fa-spin ml-2"></i>';
            btn.disabled = true;
            statusDiv.classList.add('hidden');

            try {
                // Ping Database
                const res = await fetch(`${PYTHON_API}/login`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });

                if(res.ok) {
                    // Success! Pass username via URL directly to dashboard.html
                    window.location.href = `dashboard.html?user=${encodeURIComponent(username)}`;
                } else {
                    throw new Error("Authentication rejected by server");
                }
            } catch(e) {
                console.error("Login Error:", e);
                // Offline / Error State
                statusDiv.innerText = "Connection failed. Please try again.";
                statusDiv.classList.remove('hidden');
                btn.innerText = 'Log in';
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
