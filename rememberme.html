<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clonbrow saver - Play & Learn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #0f172a; color: #1e293b; }
        .bg-grid { background-image: radial-gradient(#334155 2px, transparent 2px); background-size: 32px 32px; }
        
        /* Sophisticated Game UI */
        .game-card {
            background: white;
            border: 4px solid #1e293b;
            border-radius: 32px;
            box-shadow: 0 12px 0px #020617, inset 0 -4px 0 rgba(0,0,0,0.05);
        }
        .game-input {
            border: 3px solid #cbd5e1;
            border-radius: 20px;
            padding: 16px;
            font-weight: 800;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.125rem;
            background-color: #f8fafc;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.04);
        }
        .game-input:focus { border-color: #38bdf8; background: white; outline: none; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.3), inset 0 3px 6px rgba(0,0,0,0.02); }
        
        .game-btn {
            background-color: #38bdf8;
            color: white;
            border: 4px solid #0369a1;
            border-radius: 20px;
            box-shadow: 0 8px 0 #0284c7;
            transition: all 0.1s;
            font-weight: 900;
            font-size: 1.25rem;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        .game-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #0284c7; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center bg-grid p-4">

    <div class="game-card p-10 w-full max-w-md relative mt-12">
        <div class="absolute -top-16 left-1/2 transform -translate-x-1/2 animate-float cursor-pointer">
            <div class="w-28 h-28 bg-rose-400 rounded-3xl border-4 border-slate-900 flex items-center justify-center shadow-[0_8px_0_#9f1239]">
                <i data-lucide="sparkles" class="w-14 h-14 text-white drop-shadow-md"></i>
            </div>
        </div>

        <div class="text-center mt-12 mb-8">
            <h1 class="text-5xl font-black tracking-tight text-slate-800 drop-shadow-sm">Clonbrow saver</h1>
            <p class="text-slate-500 font-bold mt-2 text-lg">Your adventure awaits.</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div id="errorBox" class="hidden bg-rose-100 border-3 border-rose-400 p-4 rounded-2xl text-rose-700 font-bold text-center shadow-inner">
                Magic portal is closed! (Is ../Backend/server.py running on port 5000?)
            </div>

            <div>
                <label class="block text-sm font-black text-slate-400 mb-2 uppercase tracking-wider">Player Tag</label>
                <input type="text" id="userName" required placeholder="What is your name?" class="w-full game-input">
            </div>

            <div>
                <label class="block text-sm font-black text-slate-400 mb-2 uppercase tracking-wider">Save Data (Email)</label>
                <input type="email" id="userEmail" required placeholder="your@email.com" class="w-full game-input">
            </div>

            <button type="submit" id="submitBtn" class="w-full game-btn py-4 mt-6 flex items-center justify-center gap-3">
                Start Game <i data-lucide="play" class="w-6 h-6 fill-white"></i>
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();
        const API_BASE = 'https://shreeClonexx.pythonanywhere.com'; 

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'Connecting...';
            
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });
                
                if (!response.ok) throw new Error('Backend failed');
                
                const data = await response.json();
                window.location.href = `dashboard.html?userId=${data.userId}`;
            } catch (err) {
                console.error(err);
                document.getElementById('errorBox').classList.remove('hidden');
                btn.innerHTML = 'Try Again';
            }
        });
    </script>
</body>
</html>
