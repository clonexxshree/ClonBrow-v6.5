<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Announcement Hub | ClonBrow Schools</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        duo: {
                            dark: '#1e293b', blue: '#1cb0f6', green: '#58cc02', 
                            red: '#ff4b4b', yellow: '#ffc800', purple: '#ce82ff', 
                            gray: '#e5e7eb', bg: '#f8f9fa'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f8f9fa; overscroll-behavior-y: none; }
        .bg-dots { background-image: radial-gradient(#cbd5e1 2px, transparent 2px); background-size: 24px 24px; }

        .duo-card { background-color: white; border: 3px solid #1e293b; border-radius: 20px; box-shadow: 6px 6px 0px #1e293b; transition: transform 0.1s, box-shadow 0.1s;}
        
        .duo-btn {
            border: 3px solid #1e293b; border-radius: 12px; font-weight: 800; text-transform: uppercase; transition: all 0.1s; cursor: pointer;
            box-shadow: 0px 4px 0px #1e293b; display: inline-flex; align-items: center; justify-content: center;
        }
        .duo-btn:active { transform: translateY(4px); box-shadow: 0px 0px 0px #1e293b; }

        .duo-input {
            background-color: #f8fafc; border: 3px solid #cbd5e1; border-radius: 12px; padding: 12px;
            font-weight: 700; color: #1e293b; outline: none; transition: all 0.2s; width: 100%;
        }
        .duo-input:focus { border-color: #ffc800; background-color: white; }

        .notice-card.pinned { background-color: #fffbeb; border-color: #fbbf24; }
        
        .notice-content-body ul { list-style-type: disc; padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .notice-content-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .notice-content-body b, .notice-content-body strong { color: #1e293b; font-weight: 900; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* STRICT HIDING FOR TEACHER TOOLS */
        .teacher-only { display: none !important; }
        body.is-teacher .teacher-only { display: inline-flex !important; }
        body.is-teacher .teacher-only.sm-block { display: none !important; }
        @media (min-width: 640px) {
            body.is-teacher .teacher-only.sm-block { display: inline-flex !important; }
        }
    </style>
</head>
<body class="bg-dots h-screen w-screen overflow-hidden text-duo-dark flex flex-col relative">

    <!-- Role Selection Gateway -->
    <div id="role-gateway" class="fixed inset-0 bg-duo-dark/90 backdrop-blur-sm z-[60] flex flex-col items-center justify-center p-4">
        <div class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-black text-white drop-shadow-md mb-2">ClonBrow Notice Board</h1>
            <p class="font-bold text-slate-300 text-lg">Select your access level to continue.</p>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl w-full">
            <!-- Student Option -->
            <button onclick="showLogin('student')" class="duo-card p-8 flex flex-col items-center justify-center hover:-translate-y-2 hover:shadow-[8px_8px_0px_#1e293b] group text-left">
                <div class="w-20 h-20 bg-duo-green rounded-2xl border-4 border-duo-dark flex items-center justify-center text-white text-4xl mb-4 shadow-sm group-hover:scale-110 transition-transform">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h2 class="text-2xl font-black text-duo-dark">Student Access</h2>
                <p class="font-bold text-slate-500 text-center text-sm mt-2">View the latest campus news and announcements.</p>
            </button>

            <!-- Teacher Option -->
            <button onclick="showLogin('teacher')" class="duo-card p-8 flex flex-col items-center justify-center hover:-translate-y-2 hover:shadow-[8px_8px_0px_#1e293b] group text-left">
                <div class="w-20 h-20 bg-duo-purple rounded-2xl border-4 border-duo-dark flex items-center justify-center text-white text-4xl mb-4 shadow-sm group-hover:scale-110 transition-transform">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <h2 class="text-2xl font-black text-duo-dark">Teacher Access</h2>
                <p class="font-bold text-slate-500 text-center text-sm mt-2">Post, pin, and manage school-wide announcements.</p>
            </button>
        </div>
    </div>

    <!-- Teacher Login Modal -->
    <div id="teacher-login" class="fixed inset-0 bg-duo-dark/95 backdrop-blur-md z-[70] hidden items-center justify-center p-4">
        <div class="duo-card max-w-md w-full p-8 relative">
            <button onclick="goBackToGateway()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-duo-red hover:text-white flex items-center justify-center transition-colors"><i class="fas fa-times"></i></button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-duo-purple rounded-xl border-4 border-duo-dark mx-auto flex items-center justify-center text-white text-3xl mb-4 shadow-sm">
                    <i class="fas fa-lock"></i>
                </div>
                <h2 class="text-2xl font-black text-duo-dark">Staff Authentication</h2>
            </div>
            <div class="space-y-4">
                <input type="email" id="t-email" class="duo-input text-lg" placeholder="Teacher ID (e.g. School@clonbrow.in)">
                <input type="password" id="t-pass" class="duo-input text-lg" placeholder="Password">
                <button onclick="loginTeacher()" class="duo-btn bg-duo-purple text-white w-full py-3 text-lg mt-2">Verify & Enter <i class="fas fa-arrow-right ml-2"></i></button>
                <p id="t-error" class="text-duo-red font-bold text-sm text-center hidden">Invalid Credentials.</p>
            </div>
        </div>
    </div>

    <!-- Student Login Modal -->
    <div id="student-login" class="fixed inset-0 bg-duo-dark/95 backdrop-blur-md z-[70] hidden items-center justify-center p-4">
        <div class="duo-card max-w-md w-full p-8 relative">
            <button onclick="goBackToGateway()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-duo-red hover:text-white flex items-center justify-center transition-colors"><i class="fas fa-times"></i></button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-duo-green rounded-xl border-4 border-duo-dark mx-auto flex items-center justify-center text-white text-3xl mb-4 shadow-sm">
                    <i class="fas fa-user"></i>
                </div>
                <h2 class="text-2xl font-black text-duo-dark">Student Portal</h2>
            </div>
            <div class="space-y-4">
                <input type="text" id="s-name" class="duo-input text-lg" placeholder="Your Name (e.g. Alex)">
                <input type="email" id="s-email" class="duo-input text-lg" placeholder="student@school.edu">
                <button onclick="loginStudent()" class="duo-btn bg-duo-green text-white w-full py-3 text-lg mt-2">Enter Notice Board <i class="fas fa-arrow-right ml-2"></i></button>
            </div>
        </div>
    </div>


    <!-- Main Header -->
    <header class="bg-white border-b-[3px] border-duo-dark px-6 py-4 flex items-center justify-between z-30 shadow-sm shrink-0">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3">
                <div id="header-icon" class="w-12 h-12 bg-duo-yellow rounded-xl border-[3px] border-duo-dark flex items-center justify-center text-duo-dark text-2xl shadow-[4px_4px_0_#cbd5e1]">
                    <i class="fas fa-broadcast-tower"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black leading-none" id="board-title">Campus News</h1>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-widest" id="board-subtitle">Live Feed</p>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden sm:block text-right mr-2">
                <div class="font-black text-sm leading-tight" id="user-display-name">Guest</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest" id="user-display-role">Viewing</div>
            </div>
            
            <!-- TEACHER ONLY POST BUTTON (DESKTOP) -->
            <button onclick="openCompose()" class="teacher-only sm-block duo-btn bg-duo-yellow text-duo-dark px-6 py-2 shadow-[4px_4px_0_#1e293b]">
                <i class="fas fa-plus mr-2"></i> New Post
            </button>
            
            <button onclick="logout()" class="w-10 h-10 rounded-xl border-2 border-slate-300 flex items-center justify-center text-slate-400 hover:text-duo-red hover:border-duo-red transition-colors" title="Log Out">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-8 relative">
        <div class="max-w-4xl mx-auto flex flex-col gap-6 relative pb-20">
            
            <!-- TEACHER ONLY POST BUTTON (MOBILE) -->
            <button onclick="openCompose()" class="teacher-only sm:hidden duo-btn bg-duo-yellow text-duo-dark w-full py-4 text-lg mb-4">
                <i class="fas fa-plus mr-2"></i> New Announcement
            </button>

            <!-- Loading State -->
            <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-4xl mb-4 text-duo-yellow"></i>
                <h3 class="font-black text-xl">Syncing Notice Board...</h3>
            </div>

            <!-- Notices Container -->
            <div id="notices-list" class="flex flex-col gap-6 hidden">
                <!-- Javascript will populate this -->
            </div>

            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-400 text-center">
                <i class="fas fa-clipboard-list text-6xl mb-4 opacity-50"></i>
                <h3 class="font-black text-2xl text-slate-500">The board is clear.</h3>
                <p class="font-bold mt-2">No announcements have been posted yet.</p>
            </div>

        </div>
    </main>

    <!-- COMPOSE MODAL (Force Flex when opened) -->
    <div id="compose-modal" class="fixed inset-0 bg-duo-dark/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4 transition-opacity duration-300">
        <div class="duo-card w-full max-w-2xl bg-white flex flex-col max-h-[90vh]">
            <div class="p-6 border-b-[3px] border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl shrink-0">
                <h2 class="text-2xl font-black text-duo-dark"><i class="fas fa-bullhorn text-duo-yellow mr-2"></i> Create Announcement</h2>
                <button onclick="closeCompose()" class="w-10 h-10 rounded-full hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 flex-1 overflow-y-auto space-y-5">
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2">Announcement Title</label>
                    <input type="text" id="post-title" class="duo-input text-lg font-black" placeholder="E.g., Science Fair Rescheduled">
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2">Message Content</label>
                    <div class="bg-slate-100 border-[3px] border-b-0 border-[#cbd5e1] rounded-t-xl px-2 py-2 flex gap-1">
                        <button onclick="document.execCommand('bold', false, null)" class="w-8 h-8 rounded hover:bg-slate-200 font-black text-slate-600" title="Bold"><i class="fas fa-bold"></i></button>
                        <button onclick="document.execCommand('italic', false, null)" class="w-8 h-8 rounded hover:bg-slate-200 italic font-black text-slate-600" title="Italic"><i class="fas fa-italic"></i></button>
                        <button onclick="document.execCommand('underline', false, null)" class="w-8 h-8 rounded hover:bg-slate-200 underline font-black text-slate-600" title="Underline"><i class="fas fa-underline"></i></button>
                        <div class="w-px h-6 bg-slate-300 mx-1 my-auto"></div>
                        <button onclick="document.execCommand('insertUnorderedList', false, null)" class="w-8 h-8 rounded hover:bg-slate-200 font-black text-slate-600" title="Bullet List"><i class="fas fa-list-ul"></i></button>
                        <button onclick="document.execCommand('insertOrderedList', false, null)" class="w-8 h-8 rounded hover:bg-slate-200 font-black text-slate-600" title="Numbered List"><i class="fas fa-list-ol"></i></button>
                    </div>
                    <div id="post-content" contenteditable="true" class="duo-input rounded-t-none h-40 overflow-y-auto outline-none empty:before:content-[attr(placeholder)] empty:before:text-slate-400" placeholder="Type your announcement details here..."></div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2">Target Audience</label>
                        <select id="post-audience" class="duo-input cursor-pointer py-3">
                            <option value="all">Everyone (All Grades)</option>
                            <option value="grade-9">Grade 9 Only</option>
                            <option value="grade-10">Grade 10 Only</option>
                            <option value="grade-11">Grade 11 Only</option>
                            <option value="grade-12">Grade 12 Only</option>
                        </select>
                    </div>
                    
                    <div class="flex items-end">
                        <label class="flex items-center gap-3 cursor-pointer group bg-slate-50 border-2 border-slate-200 p-3 rounded-xl hover:bg-yellow-50 hover:border-yellow-200 transition-colors w-full h-[54px]">
                            <div class="relative">
                                <input type="checkbox" id="post-pin" class="sr-only">
                                <div class="block bg-slate-300 w-10 h-6 rounded-full transition-colors duration-300"></div>
                                <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300"></div>
                            </div>
                            <span class="font-bold text-sm text-slate-600 group-hover:text-duo-dark"><i class="fas fa-thumbtack text-duo-yellow mr-1"></i> Pin to Top</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="p-6 border-t-[3px] border-slate-200 bg-slate-50 rounded-b-2xl shrink-0 flex justify-end">
                <button onclick="submitNotice()" id="btn-submit" class="duo-btn bg-duo-green text-white px-8 py-3 text-lg w-full sm:w-auto shadow-[4px_4px_0_#1e293b]">
                    <i class="fas fa-paper-plane mr-2"></i> Post Notice
                </button>
            </div>
        </div>
    </div>

    <!-- Toggle Switch Styling -->
    <style>
        input:checked ~ .block { background-color: #58cc02; }
        input:checked ~ .dot { transform: translateX(100%); }
    </style>

    <script>
        // Force the absolute PythonAnywhere URL.
        const CLOUD_API = 'https://clonexxshree.pythonanywhere.com/api';
        let currentUser = null;

        // --- 1. AUTHENTICATION & UI FLOW ---

        function checkAuth() {
            const storedUser = localStorage.getItem('clonbrow_notice_user');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
                document.getElementById('role-gateway').classList.add('hidden');
                setupUIForRole();
                fetchNotices();
            } else {
                document.getElementById('role-gateway').classList.remove('hidden');
                document.getElementById('role-gateway').classList.add('flex');
            }
        }

        function showLogin(role) {
            document.getElementById('teacher-login').classList.add('hidden');
            document.getElementById('student-login').classList.add('hidden');
            document.getElementById('teacher-login').classList.remove('flex');
            document.getElementById('student-login').classList.remove('flex');

            if (role === 'teacher') {
                document.getElementById('teacher-login').classList.remove('hidden');
                document.getElementById('teacher-login').classList.add('flex');
            } else {
                document.getElementById('student-login').classList.remove('hidden');
                document.getElementById('student-login').classList.add('flex');
            }
        }

        function goBackToGateway() {
            document.getElementById('teacher-login').classList.add('hidden');
            document.getElementById('student-login').classList.add('hidden');
        }

        function loginTeacher() {
            const email = document.getElementById('t-email').value.trim();
            const pass = document.getElementById('t-pass').value.trim();
            const err = document.getElementById('t-error');

            if (email.toLowerCase() === "school@clonbrow.in" && pass === "Clonbrow@gmail.com123@#$%") {
                err.classList.add('hidden');
                currentUser = { name: "Administrator", email: email, role: 'teacher' };
                finalizeLogin();
            } else {
                err.classList.remove('hidden');
            }
        }

        function loginStudent() {
            const name = document.getElementById('s-name').value.trim();
            const email = document.getElementById('s-email').value.trim();
            if (!name || !email) return alert("Please enter your name and email.");
            
            currentUser = { name: name, email: email, role: 'student' };
            finalizeLogin();
        }

        function finalizeLogin() {
            localStorage.setItem('clonbrow_notice_user', JSON.stringify(currentUser));
            document.getElementById('role-gateway').classList.add('hidden');
            document.getElementById('teacher-login').classList.add('hidden');
            document.getElementById('student-login').classList.add('hidden');
            
            setupUIForRole();
            fetchNotices();
        }

        function logout() {
            localStorage.removeItem('clonbrow_notice_user');
            currentUser = null;
            location.reload();
        }

        // --- 2. DYNAMIC UI RENDERING ---

        function setupUIForRole() {
            document.getElementById('user-display-name').innerText = currentUser.name || 'Guest';
            
            if (currentUser.role === 'teacher') {
                document.body.classList.add('is-teacher'); // ENABLES TEACHER CSS RULES
                document.getElementById('user-display-role').innerText = 'Staff Access';
                document.getElementById('board-title').innerText = 'Announcement Control';
                document.getElementById('header-icon').className = 'w-12 h-12 bg-duo-purple rounded-xl border-[3px] border-duo-dark flex items-center justify-center text-white text-2xl shadow-[4px_4px_0_#cbd5e1]';
            } else {
                document.body.classList.remove('is-teacher'); // DISABLES TEACHER CSS RULES
                document.getElementById('user-display-role').innerText = 'Student Access';
                document.getElementById('board-title').innerText = 'Campus News';
                document.getElementById('header-icon').className = 'w-12 h-12 bg-duo-green rounded-xl border-[3px] border-duo-dark flex items-center justify-center text-white text-2xl shadow-[4px_4px_0_#cbd5e1]';
            }
        }

        // --- 3. CLOUD API LOGIC ---

        async function fetchNotices() {
            const listEl = document.getElementById('notices-list');
            const loader = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            
            listEl.classList.add('hidden');
            empty.classList.add('hidden');
            loader.classList.remove('hidden');
            loader.classList.add('flex');

            try {
                // Failsafe: Ensure we pass email for domain routing
                const userEmail = currentUser ? currentUser.email : 'guest@demo.edu';
                const url = `${CLOUD_API}/notices?email=${encodeURIComponent(userEmail)}`;
                console.log("Fetching from:", url); // Debug log
                
                const res = await fetch(url);
                if (!res.ok) throw new Error(`Network Error: ${res.status}`);
                
                const data = await res.json();
                
                loader.classList.add('hidden');
                loader.classList.remove('flex');
                
                if (!data || data.length === 0) {
                    empty.classList.remove('hidden');
                    empty.classList.add('flex');
                    return;
                }

                renderNotices(data);
                
            } catch (err) {
                console.error("Fetch Error:", err);
                loader.innerHTML = `
                    <i class="fas fa-exclamation-triangle text-duo-red text-4xl mb-4"></i>
                    <h3 class="font-black text-xl text-duo-red">Connection Failed</h3>
                    <p class="font-bold text-slate-500 mt-2 text-center text-sm px-4">Unable to connect to PythonAnywhere database.<br>Error: ${err.message}</p>
                `;
            }
        }

        function renderNotices(notices) {
            const listEl = document.getElementById('notices-list');
            listEl.innerHTML = '';
            
            notices.forEach(notice => {
                // EXTREMELY SAFE FALLBACKS
                const nTitle = notice.title || 'Untitled Notice';
                const nContent = notice.content || '';
                const nAuthor = notice.author_name || notice.author || 'School Administration';
                const nEmail = notice.author_email || 'admin@school.edu';
                const isPinned = notice.pinned === 1 || notice.is_pinned === 1 || notice.pinned === true;
                const dateText = notice.created_at || "Just now";
                const likes = notice.likes || 0;
                const dislikes = notice.dislikes || 0;
                
                const cardClass = isPinned ? 'duo-card notice-card pinned p-6 sm:p-8 relative overflow-hidden' : 'duo-card p-6 sm:p-8 relative';
                const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(nEmail)}`;
                
                let targetText = "All Students";
                if(notice.target_audience && notice.target_audience !== 'all') {
                    targetText = notice.target_audience.replace('-', ' ').toUpperCase();
                }

                // Delete Button (Only via CSS class 'teacher-only')
                const deleteBtnHtml = `
                    <button onclick="deleteNotice(${notice.id})" class="teacher-only absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-duo-red hover:text-white text-slate-400 flex items-center justify-center transition-colors shadow-sm border border-slate-200" title="Delete Announcement">
                        <i class="fas fa-trash text-sm"></i>
                    </button>`;

                const pinBadge = isPinned ? `<div class="absolute -right-10 top-4 bg-duo-yellow text-duo-dark font-black text-[10px] uppercase tracking-widest px-10 py-1 transform rotate-45 shadow-sm border border-yellow-400"><i class="fas fa-thumbtack mr-1"></i> Pinned</div>` : '';

                // Safe Comments Rendering
                const comments = notice.comments || [];
                let commentsHTML = '';
                if (comments.length > 0) {
                    comments.forEach(c => {
                        const cAuthor = c.author_name || c.author || 'Student';
                        const cText = c.content || c.text || '';
                        commentsHTML += `
                            <div class="bg-white border-2 border-slate-200 rounded-lg p-3 mb-2 shadow-sm text-sm">
                                <span class="font-black text-[#1cb0f6] mr-2">${cAuthor}:</span>
                                <span class="font-bold text-slate-600">${cText}</span>
                            </div>
                        `;
                    });
                } else {
                    commentsHTML = '<p class="text-xs font-bold text-slate-400 italic mb-2">No comments yet.</p>';
                }

                // Interactive Student Form (Only shown if student)
                const studentCommentForm = currentUser.role === 'student' ? `
                    <div class="flex gap-2">
                        <input type="text" id="comment-input-${notice.id}" class="duo-input py-2 text-sm flex-1" placeholder="Write a comment..." onkeypress="if(event.key === 'Enter') submitComment(${notice.id})">
                        <button onclick="submitComment(${notice.id})" class="duo-btn bg-duo-dark text-white px-4 py-2 text-sm"><i class="fas fa-paper-plane"></i></button>
                    </div>
                ` : '';

                const cardHtml = `
                    <div class="${cardClass}">
                        ${pinBadge}
                        ${deleteBtnHtml}
                        
                        <div class="flex items-center gap-4 mb-4 pr-12">
                            <img src="${avatarUrl}" class="w-12 h-12 rounded-xl bg-white border-2 border-slate-200">
                            <div>
                                <h3 class="font-black text-duo-dark text-lg">${nAuthor}</h3>
                                <div class="flex items-center gap-2 text-xs font-bold mt-0.5">
                                    <span class="text-slate-400">${dateText}</span>
                                    <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                                    <span class="text-duo-blue bg-blue-50 px-2 py-0.5 rounded border border-blue-100"><i class="fas fa-bullseye mr-1"></i> ${targetText}</span>
                                </div>
                            </div>
                        </div>
                        
                        <h2 class="text-2xl font-black text-duo-dark mb-3 leading-tight pr-6">${nTitle}</h2>
                        <div class="text-slate-600 font-bold leading-relaxed text-base notice-content-body mb-4">${nContent}</div>
                        
                        <!-- Interactive Social Bar -->
                        <div class="flex items-center gap-4 border-t-2 border-slate-100 pt-4 mt-4">
                            <button onclick="reactNotice(${notice.id}, 'like')" class="flex items-center gap-2 text-slate-500 hover:text-duo-blue font-black transition-colors bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                                <i class="fas fa-thumbs-up"></i> <span id="like-count-${notice.id}">${likes}</span>
                            </button>
                            <button onclick="reactNotice(${notice.id}, 'dislike')" class="flex items-center gap-2 text-slate-500 hover:text-duo-red font-black transition-colors bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                                <i class="fas fa-thumbs-down"></i> <span id="dislike-count-${notice.id}">${dislikes}</span>
                            </button>
                            <button onclick="toggleComments(${notice.id})" class="flex items-center gap-2 text-slate-500 hover:text-duo-green font-black transition-colors bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm ml-auto">
                                <i class="fas fa-comment"></i> Comments
                            </button>
                        </div>
                        
                        <!-- Comments Section -->
                        <div id="comments-section-${notice.id}" class="hidden mt-4 bg-slate-50 rounded-xl border-2 border-slate-200 p-4">
                            <div id="comments-list-${notice.id}" class="space-y-3 mb-4 max-h-48 overflow-y-auto pr-2">
                                ${commentsHTML}
                            </div>
                            ${studentCommentForm}
                        </div>
                    </div>
                `;
                listEl.insertAdjacentHTML('beforeend', cardHtml);
            });
            
            listEl.classList.remove('hidden');
        }

        async function reactNotice(id, action) {
            try {
                const res = await fetch(`${CLOUD_API}/notices/${id}/${action}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                if(res.ok) {
                    const countEl = document.getElementById(`${action}-count-${id}`);
                    countEl.innerText = parseInt(countEl.innerText) + 1;
                    countEl.parentElement.classList.add('scale-110');
                    setTimeout(() => countEl.parentElement.classList.remove('scale-110'), 150);
                }
            } catch(e) { console.error("Reaction failed", e); }
        }

        function toggleComments(id) {
            const section = document.getElementById(`comments-section-${id}`);
            section.classList.toggle('hidden');
        }

        async function submitComment(id) {
            const inputEl = document.getElementById(`comment-input-${id}`);
            if(!inputEl) return;
            const content = inputEl.value.trim();
            if(!content) return;
            
            inputEl.disabled = true;
            try {
                const res = await fetch(`${CLOUD_API}/notices/${id}/comments`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: currentUser.email,
                        name: currentUser.name,
                        content: content,
                        text: content // send both for safety
                    })
                });
                if(!res.ok) throw new Error("Failed");
                inputEl.value = '';
                fetchNotices(); 
            } catch(e) {
                console.error("Comment failed", e);
                alert("Could not post comment.");
            } finally {
                inputEl.disabled = false;
                inputEl.focus();
            }
        }

        // --- 4. COMPOSE & POST (Teacher Only) ---

        function openCompose() {
            if (currentUser.role !== 'teacher') return;
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').innerHTML = '';
            document.getElementById('post-pin').checked = false;
            
            const modal = document.getElementById('compose-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex'); // FORCE FLEX OVERRIDE
            modal.style.display = 'flex'; // DOUBLE FORCE
        }

        function closeCompose() {
            const modal = document.getElementById('compose-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modal.style.display = 'none';
        }

        async function submitNotice() {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').innerHTML.trim();
            const audience = document.getElementById('post-audience').value;
            const isPinned = document.getElementById('post-pin').checked ? 1 : 0;
            
            if (!title || !content || content === '<br>') {
                alert("Please enter a title and message content.");
                return;
            }

            const btn = document.getElementById('btn-submit');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Posting...';
            btn.disabled = true;

            const payload = {
                email: currentUser.email,
                name: currentUser.name,
                author: currentUser.name, // double safe
                role: currentUser.role,
                title: title,
                content: content,
                target_audience: audience,
                is_pinned: isPinned,
                pinned: isPinned // double safe
            };

            try {
                const res = await fetch(`${CLOUD_API}/notices`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("Failed to post");

                closeCompose();
                fetchNotices(); // Refresh feed

            } catch (err) {
                alert("Failed to post announcement. Cloud connection error.");
                console.error(err);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function deleteNotice(id) {
            if (currentUser.role !== 'teacher') return;
            if (!confirm("Are you sure you want to delete this announcement?")) return;
            
            try {
                const res = await fetch(`${CLOUD_API}/notices/${id}`, { method: 'DELETE' });
                if(res.ok) fetchNotices();
            } catch(e) {
                console.error("Failed to delete", e);
            }
        }

        // Initialize App
        window.onload = checkAuth;

    </script>
</body>
</html>
