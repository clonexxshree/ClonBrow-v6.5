<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flying Island | ClonBrow OS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #5bb0d0; font-family: 'Nunito', sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        
        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px;
        }
        .crosshair::before, .crosshair::after {
            content: ''; position: absolute; background: white; border-radius: 2px; box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        .crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        .crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        .crosshair.active::before, .crosshair.active::after { background: #4ade80; box-shadow: 0 0 10px #4ade80; }

        #start-screen {
            position: absolute; inset: 0; background: rgba(2, 132, 199, 0.9); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 50;
        }

        #interaction-prompt {
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
            background: #2563eb; color: white; padding: 15px 40px; border-radius: 15px;
            font-size: 24px; font-weight: 900; border: 4px solid #1e3a8a;
            box-shadow: 0px 8px 0px #1e3a8a; display: none; text-transform: uppercase; pointer-events: auto; cursor: pointer;
            transition: transform 0.1s;
        }
        #interaction-prompt:active {
            transform: translate(-50%, 8px);
            box-shadow: 0px 0px 0px #1e3a8a;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute; inset: 0; pointer-events: none; display: none; z-index: 20;
        }
        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: block; }
            .crosshair { display: none; }
        }
        
        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px;
            background: rgba(255, 255, 255, 0.15); border: 4px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; pointer-events: auto; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
            background: #38bdf8; border: 4px solid #0284c7; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #jump-btn {
            position: absolute; bottom: 50px; right: 50px; width: 90px; height: 90px;
            background: #4ade80; border: 4px solid #16a34a; border-radius: 50%;
            color: white; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center;
            pointer-events: auto; touch-action: none; box-shadow: 0 6px 0 #16a34a; transition: transform 0.1s;
        }
        #jump-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #16a34a; }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="crosshair" id="crosshair"></div>
        <div id="interaction-prompt">ENTER LAB</div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="jump-btn">UP</div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1 class="text-6xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)] mb-8 text-center">SKY ISLAND</h1>
        <button id="start-btn" class="bg-white text-blue-600 text-3xl font-black px-12 py-4 rounded-2xl border-4 border-blue-800 shadow-[0_8px_0_#1e3a8a] hover:translate-y-1 hover:shadow-[0_4px_0_#1e3a8a] transition-all active:translate-y-2 active:shadow-none">
            ENTER WORLD
        </button>
        <p class="mt-8 text-blue-100 font-bold tracking-widest uppercase text-center px-4">WASD / Arrows / Joystick to Move<br>Mouse / Drag to Look</p>
    </div>

    <script>
        let scene, camera, renderer, clock, raycaster;
        let world, playerBody;
        let isLocked = false;
        let isTouchMode = false;
        let clouds = [];
        let interactables = [];
        let currentHitData = null;
        let gameLoopStarted = false;
        
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joystickVec = { x: 0, y: 0 };
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let canJump = false;

        const SPAWN_POS = new THREE.Vector3(0, 15, 0);
        const ISLAND_RADIUS = 55;

        init();

        function init() {
            world = new CANNON.World();
            world.gravity.set(0, -30, 0); 
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            clock = new THREE.Clock();
            raycaster = new THREE.Raycaster();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.85; 
            renderer.outputEncoding = THREE.sRGBEncoding;
            
            document.body.appendChild(renderer.domElement);

            if (window.matchMedia("(hover: none) and (pointer: coarse)").matches) {
                isTouchMode = true;
            }

            setupHDRSkyAndSun();
            setupPlayer();
            setupFlyingIsland();
            buildPaths();
            setupOrganicGrass();
            setupIsometricTrees();
            setupEnvironmentDetails();
            setupFlowers();
            setupClouds();
            buildCaves();
            setupControls();

            window.addEventListener('resize', onWindowResize, false);
            
            if(!gameLoopStarted) {
                gameLoopStarted = true;
                animate();
            }
        }

        function setupHDRSkyAndSun() {
            const sky = new THREE.Sky();
            sky.scale.setScalar(450000);
            scene.add(sky);

            const sunVec = new THREE.Vector3();

            const effectController = {
                turbidity: 8,
                rayleigh: 2.5,
                mieCoefficient: 0.005,
                mieDirectionalG: 0.8,
                elevation: 40,
                azimuth: -150
            };

            const uniforms = sky.material.uniforms;
            uniforms[ 'turbidity' ].value = effectController.turbidity;
            uniforms[ 'rayleigh' ].value = effectController.rayleigh;
            uniforms[ 'mieCoefficient' ].value = effectController.mieCoefficient;
            uniforms[ 'mieDirectionalG' ].value = effectController.mieDirectionalG;

            const phi = THREE.MathUtils.degToRad(90 - effectController.elevation);
            const theta = THREE.MathUtils.degToRad(effectController.azimuth);
            sunVec.setFromSphericalCoords(1, phi, theta);
            uniforms[ 'sunPosition' ].value.copy(sunVec);

            const sunLight = new THREE.DirectionalLight(0xffffee, 3.5);
            sunLight.position.copy(sunVec).multiplyScalar(100);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 250;
            const d = 80;
            sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.001; 
            scene.add(sunLight);

            const sunGroup = new THREE.Group();
            sunGroup.position.copy(sunVec).multiplyScalar(200);

            const coreSunGeo = new THREE.SphereGeometry(15, 32, 32);
            const coreSunMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            const coreSun = new THREE.Mesh(coreSunGeo, coreSunMat);
            sunGroup.add(coreSun);

            const haloGeo = new THREE.SphereGeometry(25, 32, 32);
            const haloMat = new THREE.MeshBasicMaterial({ 
                color: 0xffaa00, 
                transparent: true, 
                opacity: 0.4, 
                blending: THREE.AdditiveBlending 
            });
            const halo = new THREE.Mesh(haloGeo, haloMat);
            sunGroup.add(halo);

            scene.add(sunGroup);

            const ambient = new THREE.HemisphereLight(0xffffff, 0x222222, 0.3);
            scene.add(ambient);
            
            scene.fog = new THREE.FogExp2(0x5bb0d0, 0.003);
        }

        function setupPlayer() {
            const radius = 1.0;
            const shape = new CANNON.Sphere(radius);
            playerBody = new CANNON.Body({ mass: 5, shape: shape });
            playerBody.position.copy(SPAWN_POS);
            playerBody.linearDamping = 0.9;
            world.addBody(playerBody);

            playerBody.addEventListener("collide", (e) => {
                if (e.contact.ni.y > 0.5 || e.contact.ni.y < -0.5) canJump = true;
            });
        }

        function setupFlyingIsland() {
            const islandGroup = new THREE.Group();

            const dirtGeo = new THREE.CylinderGeometry(ISLAND_RADIUS, ISLAND_RADIUS - 20, 20, 64);
            const dirtMat = new THREE.MeshStandardMaterial({ color: 0x4a3219, roughness: 1.0 });
            const dirt = new THREE.Mesh(dirtGeo, dirtMat);
            dirt.position.y = -10;
            dirt.receiveShadow = true;
            islandGroup.add(dirt);

            const grassGeo = new THREE.CylinderGeometry(ISLAND_RADIUS + 1, ISLAND_RADIUS, 2, 64);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.9 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.position.y = 1; 
            grass.receiveShadow = true;
            islandGroup.add(grass);

            scene.add(islandGroup);

            const groundShape = new CANNON.Box(new CANNON.Vec3(100, 50, 100)); 
            const groundBody = new CANNON.Body({ mass: 0, shape: groundShape });
            groundBody.position.set(0, -48, 0); 
            world.addBody(groundBody);
        }

        function buildPaths() {
            const pathGroup = new THREE.Group();
            const stoneGeo = new THREE.CylinderGeometry(1.8, 1.8, 0.4, 6);
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.9, flatShading: true });

            const directions = [{x: 0, z: -1}, {x: 1, z: 0}, {x: 0, z: 1}, {x: -1, z: 0}];

            directions.forEach(dir => {
                for(let i = 8; i < 45; i += 3.5) {
                    const stone = new THREE.Mesh(stoneGeo, stoneMat);
                    stone.position.set(dir.x * i + (Math.random()-0.5), 2.2, dir.z * i + (Math.random()-0.5));
                    stone.rotation.y = Math.random() * Math.PI;
                    stone.rotation.x = (Math.random() - 0.5) * 0.1;
                    stone.scale.setScalar(0.8 + Math.random() * 0.4);
                    stone.receiveShadow = true; stone.castShadow = true;
                    pathGroup.add(stone);
                }
            });
            scene.add(pathGroup);
        }

        function setupOrganicGrass() {
            const grassCount = 35000;
            const bladeGeo = new THREE.PlaneGeometry(0.15, 1.2, 1, 4);
            bladeGeo.translate(0, 0.6, 0); 

            const pos = bladeGeo.attributes.position.array;
            for (let i = 0; i < pos.length; i += 3) {
                const y = pos[i + 1];
                if (y > 0.5) pos[i] += Math.pow(y - 0.5, 2) * 0.4; 
            }
            bladeGeo.computeVertexNormals();

            const grassMat = new THREE.MeshStandardMaterial({ 
                color: 0x22c55e, 
                roughness: 0.8, 
                side: THREE.DoubleSide 
            });

            const instancedGrass = new THREE.InstancedMesh(bladeGeo, grassMat, grassCount);
            instancedGrass.receiveShadow = true;
            instancedGrass.castShadow = true;

            const dummy = new THREE.Object3D();
            let added = 0;
            let attempts = 0;

            while(added < grassCount && attempts < grassCount * 3) {
                attempts++;
                let r = Math.sqrt(Math.random()) * (ISLAND_RADIUS - 2); 
                let theta = Math.random() * Math.PI * 2;
                let x = Math.cos(theta) * r;
                let z = Math.sin(theta) * r;

                // Exclusion Zones
                if (Math.abs(x) < 4 || Math.abs(z) < 4) continue; // paths
                if (Math.hypot(x, z) < 8) continue; // spawn
                if (Math.hypot(x - 0, z - (-45)) < 12) continue; // N cave
                if (Math.hypot(x - 45, z - 0) < 12) continue; // E cave
                if (Math.hypot(x - 0, z - 45) < 12) continue; // S cave
                if (Math.hypot(x - (-45), z - 0) < 12) continue; // W cave

                dummy.position.set(x, 2, z);
                dummy.rotation.y = Math.random() * Math.PI * 2;
                dummy.rotation.x = (Math.random() - 0.5) * 0.2;
                dummy.rotation.z = (Math.random() - 0.5) * 0.2;
                
                const scale = 0.6 + Math.random() * 0.6;
                dummy.scale.set(scale, scale + Math.random() * 0.5, scale);
                
                dummy.updateMatrix();
                instancedGrass.setMatrixAt(added, dummy.matrix);
                
                instancedGrass.setColorAt(added, new THREE.Color().setHSL(0.33 + Math.random() * 0.05, 0.8, 0.35 + Math.random() * 0.2));
                added++;
            }
            
            instancedGrass.count = added;
            scene.add(instancedGrass);
        }

        function setupIsometricTrees() {
            const numTrees = 120;
            const treeGroup = new THREE.Group();
            
            for(let i = 0; i < numTrees; i++) {
                let r = 10 + Math.random() * (ISLAND_RADIUS - 12); 
                let theta = Math.random() * Math.PI * 2;
                let x = Math.cos(theta) * r;
                let z = Math.sin(theta) * r;

                // Exclusion Zones
                if (Math.abs(x) < 6 || Math.abs(z) < 6) continue; // paths
                if (Math.hypot(x, z) < 12) continue; // spawn
                if (Math.hypot(x - 0, z - (-45)) < 15) continue; // N cave
                if (Math.hypot(x - 45, z - 0) < 15) continue; // E cave
                if (Math.hypot(x - 0, z - 45) < 15) continue; // S cave
                if (Math.hypot(x - (-45), z - 0) < 15) continue; // W cave

                const tree = new THREE.Group();
                
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.8, 1.2, 8, 6),
                    new THREE.MeshStandardMaterial({ color: 0x4a3219, roughness: 1.0, flatShading: true })
                );
                trunk.position.y = 4; 
                trunk.castShadow = true; trunk.receiveShadow = true;
                tree.add(trunk);

                const leavesMat = new THREE.MeshStandardMaterial({ color: 0x065f46, roughness: 0.9, flatShading: true });
                
                const t1 = new THREE.Mesh(new THREE.DodecahedronGeometry(4.5, 0), leavesMat);
                t1.position.y = 6; t1.castShadow = true; t1.receiveShadow = true; tree.add(t1);
                
                const t2 = new THREE.Mesh(new THREE.DodecahedronGeometry(3.5, 0), leavesMat);
                t2.position.y = 9; t2.castShadow = true; t2.receiveShadow = true; t2.rotation.y = Math.PI / 4; tree.add(t2);

                const t3 = new THREE.Mesh(new THREE.DodecahedronGeometry(2.5, 0), leavesMat);
                t3.position.y = 11.5; t3.castShadow = true; t3.receiveShadow = true; t3.rotation.z = Math.PI / 4; tree.add(t3);

                const scale = 0.7 + Math.random() * 0.6;
                tree.scale.setScalar(scale);
                tree.position.set(x, 2, z); 
                treeGroup.add(tree);

                const treeShape = new CANNON.Box(new CANNON.Vec3(0.8 * scale, 10 * scale, 0.8 * scale));
                const treeBody = new CANNON.Body({ mass: 0, shape: treeShape });
                treeBody.position.set(x, 2 + (10 * scale), z);
                world.addBody(treeBody);
            }
            scene.add(treeGroup);
        }

        function setupEnvironmentDetails() {
            const rockGroup = new THREE.Group();
            const rockGeo = new THREE.DodecahedronGeometry(1, 0);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.9, flatShading: true });
            const darkRockMat = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.9, flatShading: true });
            
            const numRocks = 150;
            for(let i=0; i<numRocks; i++) {
                let r = 5 + Math.random() * (ISLAND_RADIUS - 6); 
                let t = Math.random() * Math.PI * 2;
                let x = Math.cos(t)*r;
                let z = Math.sin(t)*r;
                
                // Exclusion Zones
                if (Math.abs(x) < 5 || Math.abs(z) < 5) continue; // paths
                if (Math.hypot(x, z) < 10) continue; // spawn
                if (Math.hypot(x - 0, z - (-45)) < 12) continue; // N cave
                if (Math.hypot(x - 45, z - 0) < 12) continue; // E cave
                if (Math.hypot(x - 0, z - 45) < 12) continue; // S cave
                if (Math.hypot(x - (-45), z - 0) < 12) continue; // W cave

                const mat = Math.random() > 0.5 ? rockMat : darkRockMat;
                const rock = new THREE.Mesh(rockGeo, mat);
                rock.position.set(x, 2.2, z);
                
                const scaleBase = Math.random() > 0.85 ? 1.5 : 0.4; 
                rock.scale.set(scaleBase + Math.random(), scaleBase * 0.7 + Math.random()*0.4, scaleBase + Math.random());
                
                rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                rock.castShadow = true; rock.receiveShadow = true;
                rockGroup.add(rock);
            }
            scene.add(rockGroup);
        }

        function setupFlowers() {
            const flowerGroup = new THREE.Group();
            const petalGeo = new THREE.DodecahedronGeometry(0.3, 0);
            const stemGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6);
            
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.9 });
            const colors = [0xef4444, 0x3b82f6, 0xeab308, 0xd946ef]; 
            
            const mats = colors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, flatShading: true }));

            const numFlowers = 250;
            for(let i=0; i<numFlowers; i++) {
                let r = 5 + Math.random() * (ISLAND_RADIUS - 10); 
                let t = Math.random() * Math.PI * 2;
                let x = Math.cos(t)*r;
                let z = Math.sin(t)*r;

                // Exclusion Zones
                if (Math.abs(x) < 4 || Math.abs(z) < 4) continue; // paths
                if (Math.hypot(x, z) < 8) continue; // spawn
                if (Math.hypot(x - 0, z - (-45)) < 10) continue; // N cave
                if (Math.hypot(x - 45, z - 0) < 10) continue; // E cave
                if (Math.hypot(x - 0, z - 45) < 10) continue; // S cave
                if (Math.hypot(x - (-45), z - 0) < 10) continue; // W cave

                const flower = new THREE.Group();
                const stem = new THREE.Mesh(stemGeo, stemMat);
                stem.position.y = 0.3;
                stem.castShadow = true;
                
                const petalMat = mats[Math.floor(Math.random() * mats.length)];
                const petals = new THREE.Mesh(petalGeo, petalMat);
                petals.position.y = 0.6;
                petals.castShadow = true;

                flower.add(stem);
                flower.add(petals);
                
                flower.position.set(x, 2, z);
                flower.rotation.y = Math.random() * Math.PI;
                flower.rotation.x = (Math.random() - 0.5) * 0.4;
                flower.rotation.z = (Math.random() - 0.5) * 0.4;
                
                const scale = 0.6 + Math.random() * 0.8;
                flower.scale.setScalar(scale);
                
                flowerGroup.add(flower);
            }
            scene.add(flowerGroup);
        }

        function setupClouds() {
            const cloudGeo = new THREE.DodecahedronGeometry(5, 0);
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, flatShading: true });

            for(let i = 0; i < 20; i++) {
                const cloud = new THREE.Group();
                const puffs = 4 + Math.floor(Math.random() * 4);
                
                for(let p=0; p<puffs; p++) {
                    const puff = new THREE.Mesh(cloudGeo, cloudMat);
                    puff.position.set((Math.random()-0.5)*12, (Math.random()-0.5)*6, (Math.random()-0.5)*12);
                    puff.scale.setScalar(0.5 + Math.random() * 1.5);
                    puff.rotation.set(Math.random(), Math.random(), Math.random());
                    puff.castShadow = true;
                    cloud.add(puff);
                }
                
                cloud.position.set((Math.random() - 0.5) * 250, 70 + Math.random() * 50, (Math.random() - 0.5) * 250);
                scene.add(cloud);
                clouds.push(cloud);
            }
        }

        function buildCaves() {
            const cavesData = [
                { pos: new THREE.Vector3(0, 2, -45), color: 0x3b82f6, title: "ENTER CONTROL ROOM", url: 'control.html' },
                { pos: new THREE.Vector3(45, 2, 0), color: 0x10b981, title: "ENTER LIBRARY", url: 'library.html' },
                { pos: new THREE.Vector3(0, 2, 45), color: 0xa855f7, title: "ENTER BRAIN RESEARCH CENTRE", url: 'brain.html' },
                { pos: new THREE.Vector3(-45, 2, 0), color: 0xf59e0b, title: "ENTER LAB ISLAND RESEARCH CENTRE", url: 'laber.html' }
            ];

            const rockGeo = new THREE.DodecahedronGeometry(3.5, 0); 
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.9, flatShading: true });
            
            cavesData.forEach(data => {
                const caveGroup = new THREE.Group();
                
                for(let i = -2; i <= 14; i++) { 
                    const angle = (i / 12) * Math.PI;
                    const r = 7.5; 
                    const rock = new THREE.Mesh(rockGeo, rockMat);
                    rock.position.set(Math.cos(angle) * r, Math.sin(angle) * r, 0);
                    rock.position.z += (Math.random() - 0.5) * 2;
                    rock.rotation.set(Math.random(), Math.random(), Math.random());
                    rock.scale.setScalar(0.9 + Math.random() * 0.6);
                    caveGroup.add(rock);
                }

                const voidGeo = new THREE.CircleGeometry(6.8, 32);
                const voidMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
                const caveVoid = new THREE.Mesh(voidGeo, voidMat);
                caveVoid.position.set(0, 5, -2.0);
                caveGroup.add(caveVoid);

                const portalGeo = new THREE.CircleGeometry(6.5, 32);
                const portalMat = new THREE.MeshBasicMaterial({ color: data.color, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
                const portal = new THREE.Mesh(portalGeo, portalMat);
                portal.position.set(0, 5, -1.5);
                caveGroup.add(portal);

                const glowGeo = new THREE.CircleGeometry(6.8, 32);
                const glowMat = new THREE.MeshBasicMaterial({ color: data.color, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.set(0, 5, -1.3);
                caveGroup.add(glow);

                caveGroup.position.copy(data.pos);
                caveGroup.lookAt(0, 2, 0);
                scene.add(caveGroup);

                // Physical collision wall
                const wallShape = new CANNON.Box(new CANNON.Vec3(8, 10, 2));
                const wallBody = new CANNON.Body({ mass: 0, shape: wallShape });
                wallBody.position.copy(data.pos);
                const lookVec = new THREE.Vector3(0,0,0).sub(data.pos).normalize();
                const angle = Math.atan2(lookVec.x, lookVec.z);
                wallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), angle);
                world.addBody(wallBody);

                // Interaction hitbox
                const hitGeo = new THREE.BoxGeometry(14, 14, 10);
                const hitMat = new THREE.MeshBasicMaterial({ visible: false });
                const hitbox = new THREE.Mesh(hitGeo, hitMat);
                hitbox.position.copy(data.pos);
                hitbox.position.y = 7;
                scene.add(hitbox);
                
                // Store in global array
                interactables.push({ 
                    mesh: hitbox, 
                    prompt: data.title, 
                    url: data.url
                });
            });
        }

        function setupControls() {
            const startBtn = document.getElementById('start-btn');
            const startScreen = document.getElementById('start-screen');
            const interactionPrompt = document.getElementById('interaction-prompt');

            startBtn.addEventListener('click', () => {
                if (!isTouchMode) document.body.requestPointerLock();
                startScreen.style.display = 'none';
                isLocked = true;
            });

            document.addEventListener('pointerlockchange', () => {
                if (!isTouchMode) {
                    if (document.pointerLockElement === document.body) {
                        isLocked = true;
                        startScreen.style.display = 'none';
                    } else {
                        isLocked = false;
                        startScreen.style.display = 'flex';
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                    case 'Space': if(canJump) { playerBody.velocity.y = 12; canJump = false; } break;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (!isLocked || isTouchMode) return;
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= event.movementX * 0.003;
                euler.x -= event.movementY * 0.003;
                euler.x = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, euler.x));
                camera.quaternion.setFromEuler(euler);
            });

            const joystickZone = document.getElementById('joystick-zone');
            const joystickKnob = document.getElementById('joystick-knob');
            const jumpBtn = document.getElementById('jump-btn');
            let lookTouchId = null, moveTouchId = null;
            let lastLookX = 0, lastLookY = 0;

            jumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isLocked && canJump) { playerBody.velocity.y = 12; canJump = false; }
            });

            document.addEventListener('touchstart', (e) => {
                if (!isLocked || !isTouchMode) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (e.target === jumpBtn || e.target === startBtn || e.target === interactionPrompt) continue;
                    
                    if (touch.clientX < window.innerWidth / 2) {
                        moveTouchId = touch.identifier;
                        joystickZone.style.left = `${touch.clientX - 70}px`;
                        joystickZone.style.bottom = `${window.innerHeight - touch.clientY - 70}px`;
                    } else {
                        lookTouchId = touch.identifier;
                        lastLookX = touch.clientX;
                        lastLookY = touch.clientY;
                    }
                }
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (!isLocked || !isTouchMode) return;
                e.preventDefault(); 
                
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === lookTouchId) {
                        const deltaX = touch.clientX - lastLookX;
                        const deltaY = touch.clientY - lastLookY;
                        euler.setFromQuaternion(camera.quaternion);
                        euler.y -= deltaX * 0.005;
                        euler.x -= deltaY * 0.005;
                        euler.x = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, euler.x));
                        camera.quaternion.setFromEuler(euler);
                        lastLookX = touch.clientX; lastLookY = touch.clientY;
                    } else if (touch.identifier === moveTouchId) {
                        const rect = joystickZone.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        const centerY = rect.top + rect.height / 2;
                        let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
                        const distance = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
                        const angle = Math.atan2(dy, dx);
                        const knobX = Math.cos(angle) * distance, knobY = Math.sin(angle) * distance;
                        joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
                        joystickVec.x = knobX / 40; joystickVec.y = knobY / 40; 
                    }
                }
            }, { passive: false });

            const handleTouchEnd = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === lookTouchId) lookTouchId = null;
                    if (touch.identifier === moveTouchId) {
                        moveTouchId = null;
                        joystickKnob.style.transform = `translate(-50%, -50%)`;
                        joystickVec = { x: 0, y: 0 };
                        joystickZone.style.left = '40px'; joystickZone.style.bottom = '40px';
                    }
                }
            };
            document.addEventListener('touchend', handleTouchEnd);
            document.addEventListener('touchcancel', handleTouchEnd);

            const triggerInteraction = () => {
                if (!isLocked && !isTouchMode) return;
                if (currentHitData) {
                    window.location.href = currentHitData.url;
                }
            };

            document.addEventListener('mousedown', (e) => { if(!isTouchMode) triggerInteraction(); });
            interactionPrompt.addEventListener('click', triggerInteraction);
            interactionPrompt.addEventListener('touchstart', (e) => { e.preventDefault(); triggerInteraction(); });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            world.step(1/60, delta, 3);

            if (playerBody.position.y < -30) {
                playerBody.position.copy(SPAWN_POS);
                playerBody.velocity.set(0,0,0);
            }

            if (isLocked || isTouchMode) {
                const speed = 15.0;
                let inputX = Number(moveRight) - Number(moveLeft) + joystickVec.x;
                let inputZ = Number(moveBackward) - Number(moveForward) + joystickVec.y;
                
                const inputVec = new THREE.Vector3(inputX, 0, inputZ);
                if (inputVec.lengthSq() > 0) inputVec.normalize();
                
                inputVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
                
                playerBody.velocity.x = inputVec.x * speed;
                playerBody.velocity.z = inputVec.z * speed;
            }

            camera.position.copy(playerBody.position);
            camera.position.y += 2; 

            clouds.forEach(cloud => {
                cloud.rotation.y += 0.05 * delta;
                cloud.position.x -= 2 * delta; 
                if(cloud.position.x < -150) cloud.position.x = 150;
            });

            // Dynamic Interaction Raycasting
            const prompt = document.getElementById('interaction-prompt');
            const crosshair = document.getElementById('crosshair');
            
            if (isLocked || isTouchMode) {
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const intersects = raycaster.intersectObjects(interactables.map(i => i.mesh));
                
                if (intersects.length > 0 && intersects[0].distance < 15) {
                    currentHitData = interactables.find(i => i.mesh === intersects[0].object);
                    if (currentHitData) {
                        prompt.innerText = currentHitData.prompt;
                        prompt.style.display = 'block';
                        if(!isTouchMode) crosshair.classList.add('active');
                    }
                } else {
                    prompt.style.display = 'none';
                    if(!isTouchMode) crosshair.classList.remove('active');
                    currentHitData = null;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
