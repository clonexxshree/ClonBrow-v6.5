<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mangrove Garden | Clonexx Campus</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #163020; font-family: system-ui, sans-serif; background: linear-gradient(#9be7ff 0 54%, #78c76b 54%, #5a9b3a 100%); }
    .sun { position: fixed; right: 12vw; top: 9vh; width: 120px; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff68a 0%, #ffd54f 40%, #ffb300 100%); box-shadow: 0 0 120px rgba(255, 214, 79, 0.6); }
    .sun::after { content: ''; position: absolute; inset: -24px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 214, 79, 0.3) 0%, transparent 70%); }
    .grass { position: fixed; left: 0; right: 0; bottom: 0; height: 22vh; background: linear-gradient(180deg, #78c76b 0%, #4a8c3d 60%, #2e5f24 100%); pointer-events: none; }
    .grass::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 10% 30%, rgba(255,255,255,0.12) 0, transparent 14%), repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0 1px, transparent 1px 7px), repeating-linear-gradient(180deg, transparent 0 8px, rgba(0,0,0,0.08) 8px 10px); opacity: 0.75; }
    .card { position: relative; z-index: 2; text-align: center; padding: 3rem; width: min(90vw, 560px); background: rgba(255,255,255,.95); border: 5px solid #1f5130; border-radius: 28px; box-shadow: 12px 12px 0 #1f5130; }
    h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 7vw, 3.5rem); }
    p { font-size: 1.1rem; line-height: 1.5; }
    .plants { font-size: 4rem; letter-spacing: .3rem; margin: 1.5rem 0; }
    a { display: inline-block; padding: .85rem 1.2rem; border-radius: 12px; font-weight: 800; color: white; background: #267344; text-decoration: none; box-shadow: 4px 4px 0 #163020; }
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="grass"></div>
  <main class="card">
    <div class="plants">🌱 🌿 🌺</div>
    <h1>Mangrove Garden</h1>
    <p>Welcome to the greenhouse garden. New activities can grow here next.</p>
    <a href="heril.html">← Return to the island</a>
  </main>
</body>
</html>
