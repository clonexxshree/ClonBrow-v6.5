    <style>
        body { margin: 0; overflow: hidden; background-color: #f8f9fa; color: #1f2937; -webkit-font-smoothing: antialiased; }
        .video-bg { position: fixed; inset: 0; z-index: -1; width: 100vw; height: 100vh; object-fit: cover; }
        .video-overlay { position: fixed; inset: 0; z-index: 0; background: rgba(245, 247, 250, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-panel { background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(255, 255, 255, 0.6); border-bottom-color: rgba(0, 0, 0, 0.05); border-right-color: rgba(0, 0, 0, 0.05); }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; } .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }

        .custom-prose { width: 100%; max-width: 100%; font-family: 'Inter', sans-serif; color: #1f2937; }
        .custom-prose p { margin-bottom: 0.75em; line-height: 1.5; font-size: 15px; } 
        .custom-prose h1, .custom-prose h2, .custom-prose h3 { font-weight: 600; color: #111827; margin-top: 1em; margin-bottom: 0.5em; text-transform: none; line-height: 1.3; }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const LOCAL_API = 'http://127.0.0.1:8000';

            const chatInput = document.getElementById('chat-input');
            const chatContainer = document.getElementById('chat-container');
            const bottomZone = document.getElementById('bottom-zone');
            const welcomeText = document.getElementById('welcome-text');
            const historyList = document.getElementById('chat-history-list');
            const selectedModelSpan = document.getElementById('selected-model');
            
            let isGenerating = false;
            let isFirstMessage = true;
            let currentSessionId = 'session_' + Date.now().toString();
            let sessionChatsLoaded = {}; 

            window.toggleSidebar = () => {
                const sidebar = document.getElementById('sidebar-menu');
                sidebar.classList.toggle('hidden');
                sidebar.classList.toggle('absolute');
                sidebar.classList.toggle('bg-white');
                sidebar.classList.toggle('shadow-2xl');
            };

            async function loadUserProfile() {
                try {
                    const res = await fetch(`${LOCAL_API}/api/user`);
                    if (res.ok) {
                        const data = await res.json();
                        document.getElementById('user-profile-name').textContent = data.user.fullName;
                        document.getElementById('user-profile-email').textContent = data.user.email;
                        document.getElementById('welcome-name').textContent = data.user.fullName.split(' ')[0];
                    }
                } catch (e) {
                    document.getElementById('user-profile-name').textContent = "Database Error";
                }
            }

            async function loadChatHistory() {
                try {
                    const res = await fetch(`${LOCAL_API}/api/chats`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.chats && data.chats.length > 0) {
                            historyList.innerHTML = '';
                            sessionChatsLoaded = {};
                            
                            data.chats.forEach(chat => {
                                const sId = chat.session_id || 'Legacy_Chats';
                                if (!sessionChatsLoaded[sId]) sessionChatsLoaded[sId] = [];
                                sessionChatsLoaded[sId].push(chat);
                            });

                            Object.keys(sessionChatsLoaded).reverse().forEach(sId => {
                                const sessionMsgs = sessionChatsLoaded[sId];
                                const firstUserMsg = sessionMsgs.find(c => c.sender === 'user');
                                
                                if (firstUserMsg) {
                                    const historyDiv = document.createElement('div');
                                    historyDiv.className = "p-2 rounded-lg hover:bg-black/5 text-sm font-medium text-gray-700 truncate cursor-pointer transition-colors";
                                    
                                    const chatTitle = firstUserMsg.content.length > 35 ? firstUserMsg.content.substring(0, 35) + '...' : firstUserMsg.content;
                                    historyDiv.textContent = chatTitle;
                                    
                                    historyDiv.addEventListener('click', () => {
                                        loadSpecificSession(sId);
                                        const sidebar = document.getElementById('sidebar-menu');
                                        if (sidebar && !sidebar.classList.contains('hidden') && window.innerWidth < 768) {
                                            toggleSidebar();
                                        }
                                    });
                                    historyList.appendChild(historyDiv);
                                }
                            });
                        }
                    }
                } catch (e) { console.warn("Failed to fetch history from DB"); }
            }

            function loadSpecificSession(sId) {
                currentSessionId = sId;
                isFirstMessage = false; 
                chatContainer.innerHTML = ''; 
                welcomeText.style.display = 'none';
                bottomZone.classList.remove('justify-center', 'h-full');
                bottomZone.classList.add('mt-auto');
                chatContainer.classList.remove('hidden');
                chatContainer.classList.add('flex');
                
                const msgs = sessionChatsLoaded[sId] || [];
                msgs.forEach(chat => appendMessage(chat.content, chat.sender));
                scrollToBottom();
            }

            async function saveMessageToDB(sender, content) {
                try {
                    await fetch(`${LOCAL_API}/api/chats`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: currentSessionId, sender, content })
                    });
                } catch (e) { }
            }

            window.logout = () => {
                showToast('Local mode', 'No remote account is connected.', 'ph-info', 'text-gray-500');
            };

            loadUserProfile();
            loadChatHistory();

            let isCanvasEnabled = false;
            const canvasToggleBtn = document.getElementById('canvas-toggle-btn');
            const canvasIndicator = document.getElementById('canvas-indicator');

            canvasToggleBtn.addEventListener('click', () => {
                isCanvasEnabled = !isCanvasEnabled;
                if (isCanvasEnabled) {
                    canvasIndicator.classList.replace('bg-gray-300', 'bg-green-500');
                    showToast('Canvas Activated', 'Complex responses will pop out.', 'ph-layout', 'text-green-500');
                } else {
                    canvasIndicator.classList.replace('bg-green-500', 'bg-gray-300');
                    showToast('Canvas Deactivated', 'All output restricted to chat.', 'ph-prohibit', 'text-gray-500');
                    closeCanvas();
                }
            });

            window.createNewChat = () => {
                currentSessionId = 'session_' + Date.now().toString(); 
                isFirstMessage = true; 
                
                chatContainer.innerHTML = ''; 
                chatContainer.classList.add('hidden');
                chatContainer.classList.remove('flex');
                welcomeText.style.display = 'block'; 
                setTimeout(() => { welcomeText.style.opacity = '1'; }, 10);
                bottomZone.classList.add('justify-center', 'h-full'); 
                bottomZone.classList.remove('mt-auto');
                chatInput.value = ''; 
                chatInput.style.height = '52px'; 
                
                const sidebar = document.getElementById('sidebar-menu');
                if (sidebar && !sidebar.classList.contains('hidden') && window.innerWidth < 768) {
                    toggleSidebar();
                }
            };

            window.handleSendMessage = async () => {
                const message = chatInput.value.trim();
                if (!message || isGenerating) return;

                isGenerating = true;

                if (isFirstMessage) {
                    welcomeText.style.opacity = '0'; 
                    setTimeout(() => { welcomeText.style.display = 'none'; }, 300);
                    bottomZone.classList.remove('justify-center', 'h-full'); 
                    bottomZone.classList.add('mt-auto');
                    chatContainer.classList.remove('hidden'); 
                    chatContainer.classList.add('flex');
                    
                    const newHistory = document.createElement('div');
                    newHistory.className = "p-2 rounded-lg hover:bg-black/5 text-sm font-medium text-gray-700 truncate cursor-pointer transition-colors fade-in-up";
                    
                    const chatTitle = message.length > 35 ? message.substring(0, 35) + '...' : message;
                    newHistory.textContent = chatTitle;
                    
                    const clickSessionId = currentSessionId;
                    newHistory.addEventListener('click', () => {
                        loadSpecificSession(clickSessionId);
                        const sidebar = document.getElementById('sidebar-menu');
                        if (sidebar && !sidebar.classList.contains('hidden') && window.innerWidth < 768) {
                            toggleSidebar();
                        }
                    });
                    
                    historyList.insertBefore(newHistory, historyList.firstChild);
                    isFirstMessage = false;
                }

                appendMessage(message, 'user');
                chatInput.value = ''; 
                chatInput.style.height = '52px';
                showTypingIndicator();
                
                await saveMessageToDB('user', message);
                
                try {
                    const targetModel = selectedModelSpan.textContent.trim();
                    
                    const response = await fetch(`${LOCAL_API}/api/chat`, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: message, model: targetModel, session_id: currentSessionId })
                    });
                    
                    removeTypingIndicator();

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
                    
                    if (data.reply) {
                        appendMessage(data.reply, 'ai');
                        await saveMessageToDB('ai', data.reply);
                    }
                } catch (err) {
                    removeTypingIndicator();
                    appendMessage(`**Local AI unavailable:** ${err.message}. Start Ollama and the Clonexx server, then try again.`, 'ai');
                } finally {
                    isGenerating = false;
                }
            };

            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });

            function appendMessage(text, sender) {
                const isUser = sender === 'user';
                let formattedText = text;
                
                if (!isUser) { 
                    try { formattedText = marked.parse(text); } 
                    catch(e) { formattedText = text; }
                }

                const div = document.createElement('div');
                div.className = `flex fade-in-up max-w-4xl mx-auto w-full ${isUser ? 'justify-end' : 'justify-start'}`;
                const bubbleClass = isUser ? 'glass-bubble-user p-3.5 md:p-5 rounded-3xl rounded-br-sm' : 'py-2 pl-1 w-full';

                const actionButtons = isUser ? '' : `
                    <div class="flex items-center gap-1 mt-1 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <button onclick="copyToClipboard(this)" class="p-1.5 rounded-lg hover:bg-black/5 text-gray-400 hover:text-gray-700 transition-colors" title="Copy"><i class="ph ph-copy text-base"></i></button>
                        <button onclick="toggleLike(this, 'like')" class="action-btn-like p-1.5 rounded-lg hover:bg-black/5 text-gray-400 hover:text-green-600 transition-colors" title="Like"><i class="ph ph-thumbs-up text-base"></i></button>
                        <button onclick="toggleLike(this, 'dislike')" class="action-btn-dislike p-1.5 rounded-lg hover:bg-black/5 text-gray-400 hover:text-red-600 transition-colors" title="Dislike"><i class="ph ph-thumbs-down text-base"></i></button>
                    </div>`;

                div.innerHTML = `
                    <div class="flex-1 ${isUser ? 'flex justify-end' : ''} group min-w-0">
                        <div class="${bubbleClass} inline-block max-w-[95%] md:max-w-[85%] text-left">
                            <div class="msg-content custom-prose text-[15px] max-w-none">${formattedText}</div>
                        </div>
                        ${actionButtons}
                    </div>
                `;
                chatContainer.appendChild(div); scrollToBottom();
            }

            window.toggleLike = (btn, type) => {
                const container = btn.closest('.flex');
                const likeIcon = container.querySelector('.action-btn-like i');
                const dislikeIcon = container.querySelector('.action-btn-dislike i');
                
                if (type === 'like') {
                    likeIcon.classList.replace('ph', 'ph-fill');
                    dislikeIcon.classList.replace('ph-fill', 'ph');
                } else {
                    dislikeIcon.classList.replace('ph', 'ph-fill');
                    likeIcon.classList.replace('ph-fill', 'ph');
                }
            };

            function showTypingIndicator() {
                const div = document.createElement('div'); div.id = 'typing-indicator';
                div.className = `flex fade-in-up max-w-4xl mx-auto w-full justify-start`;
                div.innerHTML = `<div class="py-3 pl-1 inline-flex gap-1.5"><div class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div><div class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div><div class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div></div>`;
                chatContainer.appendChild(div); scrollToBottom();
            }

            function removeTypingIndicator() { const ind = document.getElementById('typing-indicator'); if (ind) ind.remove(); }
            function scrollToBottom() { chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' }); }

            window.showToast = (title, msg, iconClass, colorClass) => {
                const toast = document.getElementById('toast');
                document.getElementById('toast-title').textContent = title; document.getElementById('toast-message').textContent = msg;
                document.getElementById('toast-icon').className = `ph ${iconClass} text-lg ${colorClass}`;
                toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
            };

            window.copyToClipboard = (btn) => {
                const msg = btn.closest('.group').querySelector('.msg-content').innerText;
                const temp = document.createElement("textarea"); temp.value = msg;
                document.body.appendChild(temp); temp.select(); document.execCommand('copy'); document.body.removeChild(temp);
                showToast('Copied', 'Message copied to clipboard.', 'ph-check-circle', 'text-green-500');
            };

            document.getElementById('model-selector-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('model-dropdown').classList.toggle('opacity-0');
                document.getElementById('model-dropdown').classList.toggle('pointer-events-none');
                document.getElementById('model-dropdown').classList.toggle('-translate-y-2');
            });
            document.addEventListener('click', () => {
                document.getElementById('model-dropdown').classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
            });

            const modelOptions = document.querySelectorAll('.model-option');
            modelOptions.forEach(option => {
                option.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const modelName = option.getAttribute('data-model');
                    document.getElementById('selected-model').textContent = modelName;
                    modelOptions.forEach(opt => { opt.classList.remove('bg-black/5'); const i = opt.querySelector('i'); if(i) i.remove(); });
                    option.classList.add('bg-black/5');
                    option.innerHTML = `${modelName} <i class="ph-bold ph-check float-right mt-0.5 text-gray-500"></i>`;
                    document.getElementById('model-dropdown').classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
                });
            });
        });
    </script>
</body>
</html>
