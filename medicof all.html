        body {
            font-family: 'Nunito', sans-serif;
            background-color: #0ea5e9; /* Sky blue matching the screenshot */
            color: #ffffff;
            overflow: hidden;
            /* Dotted background pattern */
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.2) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* Mobile specific adjustments to restore native touch behaviors */
        @media (pointer: coarse), (max-width: 768px) {
            body {
                cursor: auto;
                overflow-y: auto; /* Allow native scroll on mobile if needed */
            }
            a, button, input, .brutalist-card {
                cursor: pointer !important;
            }
        }

        /* Custom Brutalist Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        @media (min-width: 768px) {
            ::-webkit-scrollbar {
                width: 8px;
            }
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5df;
            border: 2px solid transparent;
            border-radius: 8px;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9aabba;
            background-clip: padding-box;
        }

        /* Animations */
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brutalist Card Base */
        .brutalist-card {
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 24px;
            box-shadow: 6px 6px 0px #000000;
            transition: all 0.15s ease-out;
            will-change: transform, box-shadow;
        }

        .category-btn {
            border: 4px solid transparent;
            transition: all 0.15s ease;
        }
        .category-btn:hover {
            background-color: #f1f5f9;
            border-color: #000;
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #000;
        }
        .category-btn.active {
            background-color: #FBBF24;
            color: #000 !important;
            border-color: #000;
            box-shadow: 4px 4px 0px #000;
            transform: translate(-2px, -2px);
        }
        
        .title-shadow {
            text-shadow: 0 3px 0 #0369a1;
        }
        @media (min-width: 768px) {
            .title-shadow {
                text-shadow: 0 4px 0 #0369a1;
            }
        }

            color-scheme: light;
            --ink: #172b3a;
            --muted: #647789;
            --line: #e3eaf0;
            --surface: #ffffff;
            --canvas: #f3f6f9;
            --teal: #167c72;
            --teal-soft: #e9f5f3;
        }

        body.flex.h-screen {
            background: var(--canvas) !important;
            color: var(--ink) !important;
            cursor: auto !important;
            font-family: 'Inter', sans-serif !important;
        }

        a, button, input {
            cursor: pointer !important;
        }

        #sidebar {
            background: var(--surface) !important;
            border-right: 1px solid var(--line) !important;
            box-shadow: 8px 0 24px rgba(23, 43, 58, 0.04) !important;
        }

        #sidebar h1,
        #sidebar p,
        #sidebar i,
        #current-category-title,
        #current-category-desc,
        #modal-title {
            font-family: 'Manrope', sans-serif !important;
            text-shadow: none !important;
        }

        #sidebar h1 {
            color: var(--ink) !important;
            font-size: 1.65rem !important;
            font-weight: 800 !important;
            filter: none !important;
        }

        #sidebar > div:first-child p {
            border: 0 !important;
            padding-bottom: 0 !important;
        }

        #brand-icon {
            color: var(--teal) !important;
            stroke-width: 2px !important;
        }

        #sidebar nav {
            gap: 6px !important;
        }

        .category-btn {
            border: 1px solid transparent !important;
            border-radius: 12px !important;
            box-shadow: none !important;
            color: #536678 !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
            transform: none !important;
        }

        .category-btn:hover,

            border-color: transparent !important;
            color: var(--teal) !important;

            border: 0 !important;
            box-shadow: none !important;
            color: var(--teal) !important;

        main {

        }

        main > header {
            align-items: center !important;
            background: var(--surface) !important;
            border-bottom: 1px solid var(--line);
            padding: 24px 32px !important;
        }

        #current-category-title {
            color: var(--ink) !important;
            font-size: clamp(1.35rem, 2.4vw, 1.9rem) !important;
            font-weight: 800 !important;
            letter-spacing: -0.04em !important;
            line-height: 1.2 !important;
            text-transform: none !important;
        }

        #current-category-desc {
            color: var(--muted) !important;
            font-weight: 400 !important;
            text-shadow: none !important;
        }

        main > header > div:last-child {
            border: 1px solid var(--line) !important;
            border-radius: 12px !important;
            box-shadow: none !important;
        }

        main > header input {
            color: var(--ink) !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 0.9rem !important;

            border-radius: 16px !important;

            height: auto !important;
            min-height: 270px;

        #grid-container .brutalist-card:hover {
            border-color: #c6d9d7 !important;
            box-shadow: 0 12px 28px rgba(23, 43, 58, 0.1) !important;
            transform: translateY(-3px) !important;
        }

        #grid-container .brutalist-card > div:first-child {
            background: #f7fafb !important;
            border-bottom: 1px solid var(--line) !important;
            height: 170px !important;
        }

        #grid-container .brutalist-card > div:first-child img {
            display: none !important;
        }

        #grid-container .brutalist-card .module-icon {
            color: var(--teal) !important;
            height: 52px !important;
            stroke-width: 1.5px !important;

        #grid-container .brutalist-card > div:first-child > div {
            background: var(--teal-soft) !important;
            border: 0 !important;
            border-radius: 20px !important;
            box-shadow: none !important;
            color: var(--teal) !important;
            font-size: 0.65rem !important;
            letter-spacing: 0.08em !important;
        }

            background: var(--surface) !important;
            height: auto !important;
            min-height: 96px;
            padding: 16px 18px !important;

        #grid-container .brutalist-card h3 {
            color: var(--ink) !important;
            font-family: 'Manrope', sans-serif !important;
            font-size: 0.98rem !important;
            font-weight: 700 !important;
            letter-spacing: -0.02em !important;
            text-transform: none !important;

        #grid-container .brutalist-card p {
            color: var(--teal) !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 0.72rem !important;
            font-weight: 600 !important;
            letter-spacing: 0.02em !important;
            text-transform: none !important;

            border-radius: 18px !important;
            box-shadow: 0 24px 70px rgba(8, 24, 38, 0.24) !important;

<body class="flex h-screen selection:bg-[#FBBF24] selection:text-black">

                name: 'Mathematics',
                description: 'Core Mathematical models and algorithms for bio-computation.',
                imageUrl: 'https://res.cloudinary.com/ds93qby5a/image/upload/v1777378470/9582d258-65f9-4018-b04f-ae0b3357f802-Photoroom_liem65.png',
                files: [
                    "../html-prototypes/Math Lab Dashboard.html"
                ]
            },
            {
                id: 'physics',
                name: 'Physics Engine',
                description: 'Fundamental physics models affecting biological environments.',
                imageUrl: 'https://res.cloudinary.com/ds93qby5a/image/upload/v1777378460/85dddf79-e658-4a15-99a5-a39cc46733a1-Photoroom_xqjkpr.png',
                files: [
                    "../html-prototypes/Physics Lab Dashboard.html"
                ]
            }
        ];

        database.forEach(category => {
            category.files = category.files.map(file => file.replace(/^\.\.\/html-prototypes\//, ''));
        });

        function formatDisplayName(filename) {
            return filename.replace('.html', '');
        }

        const navContainer = document.getElementById('sidebar-nav');
        const gridContainer = document.getElementById('grid-container');
        const titleEl = document.getElementById('current-category-title');
        const descEl = document.getElementById('current-category-desc');

        /* Sidebar Toggle Logic for Mobile */
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const menuToggle = document.getElementById('menu-toggle');
        const closeSidebarBtn = document.getElementById('close-sidebar');

        function toggleSidebar() {
            const isOpen = !sidebar.classList.contains('-translate-x-full');
            if (isOpen) {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            }
        }

        if(menuToggle) menuToggle.addEventListener('click', toggleSidebar);
        if(sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
        if(closeSidebarBtn) closeSidebarBtn.addEventListener('click', toggleSidebar);

        function initSidebar() {
            const categoryIcons = {
                diagnostics: 'scan-search',
                surgical: 'scissors',
                pathologies: 'heart-pulse',
                biophysics: 'activity',
                mathematics: 'calculator',
                physics: 'atom'
            };

            database.forEach((category, index) => {
                const btn = document.createElement('button');
                btn.className = `category-btn w-full text-left px-4 md:px-5 py-3 md:py-4 rounded-2xl mb-3 flex items-center gap-3 md:gap-4 text-sm md:text-md font-black text-gray-600 uppercase tracking-wide group`;
                btn.innerHTML = `
                    <i data-lucide="${categoryIcons[category.id] || 'activity'}" class="w-8 h-8 md:w-10 md:h-10"></i>
                    ${category.name}
                `;
                btn.onclick = () => selectCategory(category.id, btn);
                navContainer.appendChild(btn);

                if (index === 0) selectCategory(category.id, btn);
            });
            lucide.createIcons();
        }

        function selectCategory(categoryId, btnElement) {
            const category = database.find(c => c.id === categoryId);

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if(btnElement) {
                btnElement.classList.add('active');
            }
            
            titleEl.textContent = category.name;
            descEl.textContent = category.description;
            gridContainer.innerHTML = '';

            // Reset search when switching categories
            const searchInput = document.getElementById('search-input');
            if(searchInput) searchInput.value = '';

            // Auto-close sidebar on mobile after selecting a category
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }

            category.files.forEach((file, index) => {
                const displayName = formatDisplayName(file);
                const delay = (index % 12) * 0.05;

                // Alternate facing logic for the asset
                const facingClass = index % 2 !== 0 ? 'scale-x-[-1]' : '';

                const card = document.createElement('div');
                card.onclick = () => openModule(file, displayName);
                card.className = `brutalist-card h-[280px] md:h-[300px] flex flex-col group no-underline fade-in-up relative overflow-hidden cursor-pointer`;
                card.style.animationDelay = `${delay}s`;

                card.innerHTML = `
                    <!-- Thumbnail Area -->
                    <div class="h-[65%] w-full relative overflow-hidden flex justify-center items-end border-b-4 border-black pt-4 bg-[#f8fafc]">
                        <img src="${category.imageUrl}" alt="" aria-hidden="true">
                        <i data-lucide="activity" class="module-icon z-10"></i>

                        <!-- Brutalist Badge -->
                        <div class="absolute top-3 right-3 md:top-4 md:right-4 bg-black border-2 border-white text-[10px] md:text-[12px] font-black uppercase tracking-widest px-2 md:px-3 py-1 md:py-1.5 rounded-lg z-20 flex items-center gap-1.5 md:gap-2 shadow-[2px_2px_0_#fff] text-white">
                            <div class="w-2 md:w-2.5 h-2 md:h-2.5 rounded-full bg-green-500"></div>
                            READY
                        </div>
                    </div>

                    <!-- Info Area -->
                    <div class="h-[35%] w-full p-4 md:p-5 flex flex-col justify-center relative bg-white">
                        <h3 class="text-[16px] md:text-[18px] font-['Fredoka_One'] text-black line-clamp-2 leading-tight uppercase relative z-10">${displayName}</h3>
                        <p class="text-xs md:text-sm font-black text-gray-500 mt-1 md:mt-2 flex items-center gap-1 uppercase tracking-wider relative z-10 group-hover:text-black transition-colors">
                            <i data-lucide="play" class="w-4 h-4 md:w-5 md:h-5 text-black fill-current"></i> Launch Module
                        </p>
                    </div>
                `;
                
                gridContainer.appendChild(card);
            });

            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', initSidebar);

        /* -----------------------------------------------------
           Module Viewer Logic (In-App Modal)
           ----------------------------------------------------- */
        const modal = document.getElementById('module-modal');
        const modalContent = document.getElementById('module-modal-content');
        const modalIframe = document.getElementById('module-iframe');
        const modalTitle = document.getElementById('modal-title');

        function openModule(file, name) {
            modalTitle.textContent = name;
            modalIframe.src = file;
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('translate-y-10');
            modalContent.classList.add('translate-y-0');
        }

        function closeModule() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('translate-y-10');
            modalContent.classList.remove('translate-y-0');
            
            // Wait for slide animation before clearing src to prevent visual pop
            setTimeout(() => {
                modalIframe.src = '';
            }, 300); 
        }

        /* -----------------------------------------------------
           Search Functionality
           ----------------------------------------------------- */
        const searchInputBox = document.getElementById('search-input');
        searchInputBox.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = gridContainer.querySelectorAll('.brutalist-card');
            
            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                if (title.includes(term)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });

    </script>
</body>
</html>
