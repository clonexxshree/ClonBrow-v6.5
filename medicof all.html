<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClonMed - AI Medical Dashboard</title>
    
    <!-- Tailwind CSS for rapid UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom styling for animations and scrollbar -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #0ea5e9; /* Sky blue matching the screenshot */
            color: #ffffff;
            cursor: none; /* Hide default cursor for gooey effect */
            overflow: hidden;
            /* Dotted background pattern */
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.2) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* Ensure links/buttons hide native cursor */
        a, button, input {
            cursor: none !important;
        }

        /* Mobile specific adjustments to restore native touch behaviors */
        @media (pointer: coarse), (max-width: 768px) {
            body {
                cursor: auto;
                overflow-y: auto; /* Allow native scroll on mobile if needed */
            }
            a, button, input, .brutalist-card {
                cursor: pointer !important;
            }
            #fluid-cursor {
                display: none !important; /* Hide fluid cursor on touch devices */
            }
        }

        /* Custom Brutalist Scrollbar */
        ::-webkit-scrollbar {
            width: 8px; /* Slightly thinner for mobile */
        }
        @media (min-width: 768px) {
            ::-webkit-scrollbar {
                width: 12px;
            }
        }
        ::-webkit-scrollbar-track {
            background: #ffffff;
            border-left: 4px solid #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #000000;
            border-left: 4px solid #000;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333333;
        }

        /* Animations */
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brutalist Card Base */
        .brutalist-card {
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 24px;
            box-shadow: 6px 6px 0px #000000;
            transition: all 0.15s ease-out;
            will-change: transform, box-shadow;
        }

        .category-btn {
            border: 4px solid transparent;
            transition: all 0.15s ease;
        }
        .category-btn:hover {
            background-color: #f1f5f9;
            border-color: #000;
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #000;
        }
        .category-btn.active {
            background-color: #FBBF24;
            color: #000 !important;
            border-color: #000;
            box-shadow: 4px 4px 0px #000;
            transform: translate(-2px, -2px);
        }
        
        .title-shadow {
            text-shadow: 0 3px 0 #0369a1;
        }
        @media (min-width: 768px) {
            .title-shadow {
                text-shadow: 0 4px 0 #0369a1;
            }
        }

    </style>
</head>
<body class="flex h-screen selection:bg-[#FBBF24] selection:text-black">

        function formatDisplayName(filename) {
            return filename.replace('.html', '');
        }

        const navContainer = document.getElementById('sidebar-nav');
        const gridContainer = document.getElementById('grid-container');
        const titleEl = document.getElementById('current-category-title');
        const descEl = document.getElementById('current-category-desc');

        /* Sidebar Toggle Logic for Mobile */
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const menuToggle = document.getElementById('menu-toggle');
        const closeSidebarBtn = document.getElementById('close-sidebar');

        function toggleSidebar() {
            const isOpen = !sidebar.classList.contains('-translate-x-full');
            if (isOpen) {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            }
        }

        if(menuToggle) menuToggle.addEventListener('click', toggleSidebar);
        if(sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
        if(closeSidebarBtn) closeSidebarBtn.addEventListener('click', toggleSidebar);

        function initSidebar() {
            database.forEach((category, index) => {
                const btn = document.createElement('button');
                btn.className = `category-btn w-full text-left px-4 md:px-5 py-3 md:py-4 rounded-2xl mb-3 flex items-center gap-3 md:gap-4 text-sm md:text-md font-black text-gray-600 uppercase tracking-wide group`;
                btn.innerHTML = `
                    <img src="${category.imageUrl}" alt="${category.name} icon" class="w-8 h-8 md:w-10 md:h-10 object-contain drop-shadow-[0_4px_0_rgba(0,0,0,0.2)] group-hover:scale-110 transition-transform">
                    ${category.name}
                `;
                btn.onclick = () => selectCategory(category.id, btn);
                navContainer.appendChild(btn);

                if (index === 0) selectCategory(category.id, btn);
            });
            lucide.createIcons();
        }

        function selectCategory(categoryId, btnElement) {
            const category = database.find(c => c.id === categoryId);

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if(btnElement) {
                btnElement.classList.add('active');
            }
            
            titleEl.textContent = category.name;
            descEl.textContent = category.description;
            gridContainer.innerHTML = '';

            // Reset search when switching categories
            const searchInput = document.getElementById('search-input');
            if(searchInput) searchInput.value = '';

            // Auto-close sidebar on mobile after selecting a category
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }

            category.files.forEach((file, index) => {
                const displayName = formatDisplayName(file);
                const delay = (index % 12) * 0.05;

                // Alternate facing logic for the asset
                const facingClass = index % 2 !== 0 ? 'scale-x-[-1]' : '';

                const card = document.createElement('div');
                card.onclick = () => openModule(file, displayName);
                card.className = `brutalist-card h-[280px] md:h-[300px] flex flex-col group no-underline fade-in-up relative overflow-hidden cursor-pointer`;
                card.style.animationDelay = `${delay}s`;

                card.innerHTML = `
                    <!-- Thumbnail Area -->
                    <div class="h-[65%] w-full relative overflow-hidden flex justify-center items-end border-b-4 border-black pt-4 bg-[#f8fafc]">
                        <img src="${category.imageUrl}" alt="Category Symbol" class="z-10 w-[60%] md:w-[65%] h-full object-contain object-bottom drop-shadow-[0_8px_0_rgba(0,0,0,0.6)] transition-transform duration-200 ease-out group-hover:scale-110 ${facingClass}">

                        <!-- Brutalist Badge -->
                        <div class="absolute top-3 right-3 md:top-4 md:right-4 bg-black border-2 border-white text-[10px] md:text-[12px] font-black uppercase tracking-widest px-2 md:px-3 py-1 md:py-1.5 rounded-lg z-20 flex items-center gap-1.5 md:gap-2 shadow-[2px_2px_0_#fff] text-white">
                            <div class="w-2 md:w-2.5 h-2 md:h-2.5 rounded-full bg-green-500"></div>
                            READY
                        </div>
                    </div>

                    <!-- Info Area -->
                    <div class="h-[35%] w-full p-4 md:p-5 flex flex-col justify-center relative bg-white">
                        <h3 class="text-[16px] md:text-[18px] font-['Fredoka_One'] text-black line-clamp-2 leading-tight uppercase relative z-10">${displayName}</h3>
                        <p class="text-xs md:text-sm font-black text-gray-500 mt-1 md:mt-2 flex items-center gap-1 uppercase tracking-wider relative z-10 group-hover:text-black transition-colors">
                            <i data-lucide="play" class="w-4 h-4 md:w-5 md:h-5 text-black fill-current"></i> Launch Module
                        </p>
                    </div>
                `;
                
                // Active Hover Physics - Mobile safe
                card.addEventListener('mouseenter', () => {
                    if(window.matchMedia("(hover: hover)").matches) {
                        card.style.transform = `translate(-4px, -4px)`;
                        card.style.boxShadow = `12px 12px 0px #000000`;
                    }
                });

                card.addEventListener('mouseleave', () => {
                    if(window.matchMedia("(hover: hover)").matches) {
                        card.style.transform = `translate(0, 0)`;
                        card.style.boxShadow = `6px 6px 0px #000000`;
                    }
                });

                gridContainer.appendChild(card);
            });

            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', initSidebar);

        /* -----------------------------------------------------
           Module Viewer Logic (In-App Modal)
           ----------------------------------------------------- */
        const modal = document.getElementById('module-modal');
        const modalContent = document.getElementById('module-modal-content');
        const modalIframe = document.getElementById('module-iframe');
        const modalTitle = document.getElementById('modal-title');

        function openModule(file, name) {
            modalTitle.textContent = name;
            modalIframe.src = file;
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('translate-y-10');
            modalContent.classList.add('translate-y-0');
        }

        function closeModule() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('translate-y-10');
            modalContent.classList.remove('translate-y-0');
            
            // Wait for slide animation before clearing src to prevent visual pop
            setTimeout(() => {
                modalIframe.src = '';
            }, 300); 
        }

        /* -----------------------------------------------------
           Search Functionality
           ----------------------------------------------------- */
        const searchInputBox = document.getElementById('search-input');
        searchInputBox.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = gridContainer.querySelectorAll('.brutalist-card');
            
            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                if (title.includes(term)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        /* -----------------------------------------------------
           Fluid "Ink" Cursor Logic (Gooey SVG Tracker)
           ----------------------------------------------------- */
        const fluidContainer = document.getElementById('fluid-cursor');
        
        // Configuration
        const NUM_TRAIL_DOTS = 12; // Number of tracking ink droplets
        const trailDots = [];
        
        let targetMouseX = window.innerWidth / 2;
        let targetMouseY = window.innerHeight / 2;

        // Build the physical DOM elements for the fluid trail
        for (let i = 0; i < NUM_TRAIL_DOTS; i++) {
            let dot = document.createElement('div');
            // Brutalist twist: make the drops solid black ink
            let size = i === 0 ? 'w-6 h-6' : 'w-5 h-5';
            dot.className = `absolute ${size} bg-black rounded-full left-0 top-0 -ml-3 -mt-3 will-change-transform`;
            fluidContainer.appendChild(dot);
            trailDots.push({ el: dot, x: targetMouseX, y: targetMouseY });
        }

        // Track literal mouse position (only active on non-touch devices via CSS override)
        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        // Animation loop for fluid drag physics
        function animateFluidCursor() {
            trailDots.forEach((dot, index) => {
                let chaseX = index === 0 ? targetMouseX : trailDots[index - 1].x;
                let chaseY = index === 0 ? targetMouseY : trailDots[index - 1].y;
                
                let spring = index === 0 ? 0.5 : 0.3;
                
                dot.x += (chaseX - dot.x) * spring;
                dot.y += (chaseY - dot.y) * spring;
                
                let scale = 1 - (index / NUM_TRAIL_DOTS) * 0.6;
                
                dot.el.style.transform = `translate(${dot.x}px, ${dot.y}px) scale(${scale})`;
            });

            requestAnimationFrame(animateFluidCursor);
        }
        
        animateFluidCursor();

        // Interactive cursor state for buttons and cards
        document.addEventListener('mouseover', (e) => {
            // Check if device supports hover before scaling fluid cursor
            if (window.matchMedia("(hover: hover)").matches && e.target.closest('.brutalist-card, button, input')) {
                trailDots[0].el.classList.replace('bg-black', 'bg-[#FBBF24]'); // Turns yellow on hover
                trailDots[0].el.classList.add('scale-150');
            }
        });
        document.addEventListener('mouseout', (e) => {
            if (window.matchMedia("(hover: hover)").matches && e.target.closest('.brutalist-card, button, input')) {
                trailDots[0].el.classList.replace('bg-[#FBBF24]', 'bg-black');
                trailDots[0].el.classList.remove('scale-150');
            }
        });

    </script>
</body>
</html>
