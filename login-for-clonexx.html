<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clonexx AI - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if(window.tailwind) {
                tailwind.config = { theme: { extend: { colors: { brand: { dark: '#0a0a0a' } }, transitionTimingFunction: { 'smooth': 'cubic-bezier(0.25, 0.1, 0.25, 1)' } } } }
            }
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .font-bodoni { font-family: 'Bodoni Moda', serif; }
        body { font-family: 'Inter', sans-serif; background-color: #ebedef; overflow: hidden; -webkit-font-smoothing: antialiased; }
        .glass-panel { background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(255, 255, 255, 0.8); border-right-color: rgba(255, 255, 255, 0.3); border-bottom-color: rgba(255, 255, 255, 0.3); }
        .video-bg-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .video-bg-container video { width: 100%; height: 100%; object-fit: cover; opacity: 1; }
        .video-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.35); }
        .tilt-container { perspective: 1500px; }
        #tilt-card { transition: height 0.4s ease; position: relative; transform-origin: center center; will-change: transform; }
        .flat-input { background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.7); transition: all 0.2s ease; color: #1f2937; }
        .flat-input:focus { background: rgba(255, 255, 255, 0.8); border-color: rgba(0, 0, 0, 0.2); outline: none; }
        .form-view { transition: opacity 0.4s ease, transform 0.4s ease; position: absolute; top: 0; left: 0; width: 100%; }
        .form-hidden { opacity: 0; pointer-events: none; transform: translateY(10px); }
        .form-active { opacity: 1; pointer-events: auto; transform: translateY(0); }
    </style>
</head>
<body class="w-full min-h-screen flex flex-col relative text-gray-900 selection:bg-black/10">

    <div id="auth-view" class="absolute inset-0 z-50 flex flex-col">
        <div class="video-bg-container">
            <video autoplay muted loop playsinline><source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260602_150901_c45b90ec-18d7-42ff-90e2-b95d7109e330.mp4" type="video/mp4"></video>
            <div class="video-overlay"></div>
        </div>

        <nav class="absolute top-0 inset-x-0 z-40 pt-6 px-6 sm:px-12 flex justify-between items-center">
            <a href="#" class="font-bodoni text-2xl font-light tracking-tight italic text-white drop-shadow-md">Clonexx<span class="font-bold">AI</span></a>
        </nav>

        <main class="flex-1 flex items-center justify-center p-4 w-full h-full tilt-container">
            <div id="tilt-card" class="glass-panel w-full max-w-md rounded-[2rem] p-8 sm:p-10 relative overflow-hidden" style="height: 520px;">
                
                <div id="view-login" class="form-view form-active p-8 sm:p-10">
                    <div class="text-center mb-8">
                        <h1 class="text-[28px] font-bold tracking-tight text-gray-900 mb-2">Welcome Back</h1>
                        <p class="text-[14px] text-gray-600 font-medium">Enter your details to access the AI.</p>
                    </div>

                    <form id="login-form" class="space-y-4">
                        <div>
                            <label class="block text-[12px] font-bold text-gray-800 mb-1.5 ml-1 uppercase tracking-wider">Email Address</label>
                            <input type="email" required placeholder="you@example.com" class="w-full flat-input rounded-xl px-4 py-3.5 text-[14px] placeholder-gray-500 font-medium">
                        </div>
                        <div>
                            <label class="block text-[12px] font-bold text-gray-800 mb-1.5 ml-1 uppercase tracking-wider">Password</label>
                            <input type="password" required placeholder="••••••••" class="w-full flat-input rounded-xl px-4 py-3.5 text-[14px] placeholder-gray-500 font-medium">
                        </div>
                        <button type="submit" class="w-full bg-[#1a1a1a] text-white rounded-xl py-4 mt-4 text-[14px] font-bold hover:bg-[#333333] active:scale-[0.98] transition-all">
                            Sign In
                        </button>
                        <div id="login-error" class="text-red-500 text-xs text-center hidden mt-2"></div>
                    </form>

                    <p class="text-center text-[13px] text-gray-600 font-medium mt-8">
                        Don't have an account? <button type="button" onclick="switchView('register')" class="text-black font-bold hover:underline ml-1 cursor-pointer">Register here</button>
                    </p>
                </div>

                <div id="view-register" class="form-view form-hidden p-8 sm:p-10">
                    <div class="text-center mb-6">
                        <h1 class="text-[28px] font-bold tracking-tight text-gray-900 mb-2">Create Account</h1>
                        <p class="text-[14px] text-gray-600 font-medium">Join Clonexx AI for exclusive access.</p>
                    </div>

                    <form id="register-form" class="space-y-4">
                        <div>
                            <label class="block text-[12px] font-bold text-gray-800 mb-1.5 ml-1 uppercase tracking-wider">Full Name</label>
                            <input type="text" required placeholder="John Doe" class="w-full flat-input rounded-xl px-4 py-3 text-[14px] placeholder-gray-500 font-medium">
                        </div>
                        <div>
                            <label class="block text-[12px] font-bold text-gray-800 mb-1.5 ml-1 uppercase tracking-wider">Email Address</label>
                            <input type="email" required placeholder="you@example.com" class="w-full flat-input rounded-xl px-4 py-3 text-[14px] placeholder-gray-500 font-medium">
                        </div>
                        <div>
                            <label class="block text-[12px] font-bold text-gray-800 mb-1.5 ml-1 uppercase tracking-wider">Password</label>
                            <input type="password" required placeholder="Create a strong password" class="w-full flat-input rounded-xl px-4 py-3 text-[14px] placeholder-gray-500 font-medium">
                        </div>
                        <button type="submit" class="w-full bg-[#1a1a1a] text-white rounded-xl py-4 mt-2 text-[14px] font-bold hover:bg-[#333333] active:scale-[0.98] transition-all">
                            Complete Registration
                        </button>
                        <div id="register-error" class="text-red-500 text-xs text-center hidden mt-2"></div>
                    </form>

                    <p class="text-center text-[13px] text-gray-600 font-medium mt-6">
                        Already a member? <button type="button" onclick="switchView('login')" class="text-black font-bold hover:underline ml-1 cursor-pointer">Sign in</button>
                    </p>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // NUKING ALL OLD LOCAL STORAGE TO PREVENT ACCOUNT STICKING
            localStorage.clear();
            sessionStorage.clear();

            const viewLogin = document.getElementById('view-login');
            const viewRegister = document.getElementById('view-register');
            const card = document.getElementById('tilt-card');
            
            window.switchView = (targetView) => {
                if (targetView === 'register') {
                    viewLogin.classList.replace('form-active', 'form-hidden');
                    viewRegister.classList.replace('form-hidden', 'form-active');
                    card.style.height = '580px';
                } else {
                    viewRegister.classList.replace('form-active', 'form-hidden');
                    viewLogin.classList.replace('form-hidden', 'form-active');
                    card.style.height = '520px';
                }
            };

            const showError = (element, message) => { 
                element.textContent = message; 
                element.classList.remove('hidden'); 
            };

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = e.target.querySelector('input[type="email"]').value;
                const password = e.target.querySelector('input[type="password"]').value;
                const btn = e.target.querySelector('button[type="submit"]');
                const errDiv = document.getElementById('login-error');
                
                errDiv.classList.add('hidden');
                btn.innerHTML = 'Authenticating...'; 
                
                try {
                    const response = await fetch('https://shreeClonexx.pythonanywhere.com/api/login', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await response.json();
                    
                    if (response.ok) {
                        // FIX: Using SessionStorage so it dies when tab closes!
                        sessionStorage.setItem('clonexx_token', data.token); 
                        btn.innerHTML = 'Success! Redirecting...';
                        window.location.href = './clonexx-(chat).html'; 
                    } else {
                        showError(errDiv, data.error || 'Login Failed.');
                        btn.innerHTML = 'Sign In'; 
                    }
                } catch (err) {
                    showError(errDiv, 'Database offline. Ensure Node server is running on port 5000.');
                    btn.innerHTML = 'Sign In'; 
                }
            });

            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fullName = e.target.querySelector('input[type="text"]').value;
                const email = e.target.querySelector('input[type="email"]').value;
                const password = e.target.querySelector('input[type="password"]').value;
                const btn = e.target.querySelector('button[type="submit"]');
                const errDiv = document.getElementById('register-error');

                errDiv.classList.add('hidden');
                btn.innerHTML = 'Creating Account...';

                try {
                    const response = await fetch('https://shreeClonexx.pythonanywhere.com/api/register', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullName, email, password })
                    });
                    const data = await response.json();
                    
                    if (response.ok) {
                        // FIX: Using SessionStorage so it dies when tab closes!
                        sessionStorage.setItem('clonexx_token', data.token); 
                        btn.innerHTML = 'Success! Redirecting...';
                        window.location.href = './clonexx-(chat).html'; 
                    } else {
                        showError(errDiv, data.error || 'Registration Failed.');
                        btn.innerHTML = 'Complete Registration'; 
                    }
                } catch (err) {
                    showError(errDiv, 'Database offline. Ensure Node server is running on port 5000.');
                    btn.innerHTML = 'Complete Registration'; 
                }
            });
        });
    </script>
</body>
</html>
